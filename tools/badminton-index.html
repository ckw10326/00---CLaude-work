腳下步法與重心轉換", "start": "03:53", "end": "04:03、13:26–14:00", "lines": [{"level": 0, "text": "啟動→並步→重心移至右腿→跳"}, {"level": 0, "text": "是否側身依球的位置與高度決定，球偏可少側身，球高可多側身"}]}, {"heading": "手上動作核心：展肩、轉腰、內旋", "start": "04:03", "end": "06:29", "lines": [{"level": 0, "text": "並步重心到右腿時開始展肩，手前放"}, {"level": 0, "text": "跳起同時做「往後收/下拉」動作，帶動甩拍與跳同步發生"}, {"level": 0, "text": "手指抓拍動作需配合球速調整（建議另看殺球/抖球專課）"}]}, {"heading": "落地與彎腰要領（最關鍵細節）", "start": "06:29", "end": "11:19", "lines": [{"level": 0, "text": "落地重心不可停留在右側，要迅速調整回中或往外"}, {"level": 0, "text": "反覆強調：彎腰貼近球下方是能否殺兇的關鍵（\"腰能不能繃住\"）"}, {"level": 0, "text": "對比錯誤示範：身體打平、不彎腰則無法有效發力殺球"}]}, {"heading": "前腳掌發力與連貫動作示範", "start": "11:19", "end": "12:17", "lines": [{"level": 0, "text": "全程用前腳掌接觸地面，避免腳跟落地造成僵硬、速度變慢"}]}, {"heading": "落地後的回位與再啟動", "start": "12:17", "end": "13:26", "lines": [{"level": 0, "text": "殺完後立即轉換到半場防守/迎接下一拍的平行啟動姿勢"}, {"level": 0, "text": "若對方回擊高球，可直接原地再次起跳，不需完整回中"}]}, {"heading": "收尾與後續銜接", "start": "14:00", "end": "14:47", "lines": [{"level": 0, "text": "已學會前場封網、中場抽球殺球、後場吊殺"}, {"level": 0, "text": "下一步將學習雙打跑位（帶套路）的步伐訓練，並強調需先練熟各單一位置步法"}]}]}, {"category": "步伐教學", "num": 41, "title": "41.雙打混雙網前4點跑位步伐（1）", "tags": [{"tag": "常見錯誤：封網誤做成「跳」而非「調整步」", "reason": "01:37–05:33，全片核心糾錯點，反覆用對比示範說明許多人做錯"}, {"tag": "正確封網回位：橫向調整步（非跳躍）", "reason": "04:28–13:29，示範正確的重心轉換、身體轉正、並回動作"}, {"tag": "正手封網並步壓球動作", "reason": "07:41–09:39，並步、弓箭步、握拍手法細節"}, {"tag": "左手（非持拍手）配合抬起的重要性", "reason": "13:46–14:12，強調若不做會顯得動作僵硬不協調"}, {"tag": "特殊情況：對方回後場高球時可用單腳跳殺", "reason": "06:21–07:16，說明僅在搭檔後場殺球、對方防守不到位時才使用跳躍式進攻"}, {"tag": "回位速度依對方回球力道調整", "reason": "12:59–13:29，抽得快則需往後退，抽得輕則可直接往右去"}, {"tag": "前腳掌落地要求", "reason": "15:29–16:11，避免腳跟落地導致無法快速移動"}], "segments": [{"heading": "開場與常見錯誤示範", "start": "00:00", "end": "03:54", "lines": [{"level": 0, "text": "說明前面已學會往前壓球、中場抽球、殺球、後場步法，現在開始學雙打跑位步伐"}, {"level": 0, "text": "示範很多人封網練習時的錯誤動作：每次打完都跳起來準備下一拍"}, {"level": 0, "text": "錯誤原因：跳躍動作只適合對方回球特別高的情況，若對方抽得平，跳起來會來不及封網或直接失誤（落網）"}]}, {"heading": "正確封網回位的原理演示", "start": "03:54", "end": "06:21", "lines": [{"level": 0, "text": "正確動作為打完後做「調整步」（重心橫移），而非向上跳"}, {"level": 0, "text": "特殊例外：若對方直接抽得很快，來不及做調整步，則維持站姿彎腰打，之後再處理（後述可用另一種方式）"}]}, {"heading": "特殊情境：搭檔後場殺球時的單腳跳殺", "start": "06:21", "end": "07:16", "lines": [{"level": 0, "text": "僅當站在網前、搭檔在後場殺球、對方防守不到位挑出後場高球時，才可做單腳起跳扣殺"}, {"level": 0, "text": "與兩邊跳殺道理相同"}]}, {"heading": "正手封網步法與握拍細節", "start": "07:41", "end": "10:53", "lines": [{"level": 0, "text": "啟動→並步→壓球（弓箭步），手抬到頭部高度，握法同正手"}, {"level": 0, "text": "打完後身體呈約45度斜站，而非完全平行站，目的是留出反應空間應對對方快速抽球"}, {"level": 0, "text": "個子高的人需適度屈膝以配合網帶高度，避免手位過高造成漏防"}]}, {"heading": "核心：正確調整步詳解", "start": "10:53", "end": "13:29", "lines": [{"level": 0, "text": "打完後身體重心會前傾，需做一個「調整步」而非跳躍來穩住並準備下一拍"}, {"level": 0, "text": "此動作原理與防守步法相同（先前防守課程中已教過的移動方式）"}, {"level": 0, "text": "調整步方向（往右或往後）依對方抽球力道與速度決定：抽得重則往後退，抽得輕則可直接往右"}]}, {"heading": "完整正手示範與左手配合", "start": "13:29", "end": "16:11", "lines": [{"level": 0, "text": "連續示範完整正手封網＋調整步動作"}, {"level": 0, "text": "強調左手（非持拍手）務必配合抬起，否則整體動作顯得僵硬不自然"}, {"level": 0, "text": "全程使用前腳掌接觸地面以維持移動速度"}]}, {"heading": "特殊情境：搭檔殺球後可用跳殺方式進攻", "start": "16:11", "end": "19:25", "lines": [{"level": 0, "text": "若搭檔在後方殺球、對方抽得較高，可換用先前學過的半場跳殺動作"}, {"level": 0, "text": "收尾：正手方向教學完成，下集接續反拍方向"}]}]}, {"category": "步伐教學", "num": 42, "title": "42.雙打混雙網前4點跑位步伐（2）", "tags": [{"tag": "反拍封網正確調整步（頂腰、非跳躍）", "reason": "00:55–06:56，本集核心，糾正反拍常見跳躍錯誤，強調「頂住腰」動作"}, {"tag": "反拍手上動作：橫向擊球而非直拍", "reason": "06:56–08:03，因球平無法直拍，須橫向由外往內打"}, {"tag": "反拍封網並步與握拍", "reason": "00:00–00:55，拇指頂寬面、抬拍高過頭"}, {"tag": "對方抽球極快時的替代方案：小跳＋彎腰快速調整", "reason": "12:16–17:37，處理來不及做完整調整步的情況"}, {"tag": "斜著往後撤（非直線後退）", "reason": "03:28–04:03，依對方抽球方向調整撤步角度"}, {"tag": "搭檔後場殺球情境下的反拍單步跳殺", "reason": "08:39–09:18，特殊情境的跳殺處理"}, {"tag": "封網後可原地等待（屬套路範疇，非純步法）", "reason": "11:26–12:16，簡述套路概念但強調本集只講步法本身"}, {"tag": "全場串連練習示範", "reason": "17:37–19:19，正反手封網連續操作展示"}], "segments": [{"heading": "反拍封網基本動作與握拍", "start": "00:00", "end": "00:55", "lines": [{"level": 0, "text": "平行啟動、右腿推、弓箭步"}, {"level": 0, "text": "拇指頂在拍柄寬面，抬拍高過頭，推球後稍微抓一下（不可推前就抓）"}]}, {"heading": "反拍常見錯誤：跳躍式回位", "start": "00:55", "end": "03:28", "lines": [{"level": 0, "text": "很多人退回時右腿發力直接跳起，動作看似順手但實際上打法有誤"}, {"level": 0, "text": "對比正確做法：不應跳躍，而是做橫向重心轉換的「調整步」"}, {"level": 0, "text": "錯誤動作核心問題：頭頂/反拍如果不會彎腰、只靠跳躍，遇到對方抽平球會完全接不到"}]}, {"heading": "斜向撤步與方向判斷", "start": "03:28", "end": "04:03", "lines": [{"level": 0, "text": "打完後不可直線後撤，需依對方回球方向（邊線或平抽）斜向移動左腿"}, {"level": 0, "text": "目的：確保能覆蓋對方抽直線或抽邊線的來球"}]}, {"heading": "核心：頂腰調整步詳解", "start": "04:03", "end": "06:56", "lines": [{"level": 0, "text": "對方抽得重/遠時，需做較大幅度的重心轉換，挪到左腿，同時頂住腰部（非直背）"}, {"level": 0, "text": "強調這不是「跳」而是一個帶轉換的協調動作，讓身體能立刻銜接下一次前並步"}]}, {"heading": "反拍手上動作：橫向擊球", "start": "06:56", "end": "08:03", "lines": [{"level": 0, "text": "因回球通常很平，無法用直拍下壓，需模擬「由外往內」橫向擊球，避免下網或無力"}, {"level": 0, "text": "若尚未掌握此技巧，需另看封網技巧教學"}]}, {"heading": "反拍封網連續步法練習", "start": "08:03", "end": "12:16", "lines": [{"level": 0, "text": "示範封網後平行啟動、並兩步接下一拍"}, {"level": 0, "text": "提及：封網後可視戰術選擇原地等待（不動），但此屬套路而非純步法內容"}]}, {"heading": "應對快速平抽球的替代處理", "start": "12:16", "end": "17:37", "lines": [{"level": 0, "text": "若對方回球極快、來不及做完整調整步，改用「小跳＋彎腰」的快速版本"}, {"level": 0, "text": "詳細比較兩種節奏：完整調整步（較從容）vs. 小跳版（應急、更快）"}, {"level": 0, "text": "強調做快時看似在跳，但其實仍是重心調整而非真正起跳"}]}, {"heading": "全場正反手封網連續示範與收尾", "start": "17:37", "end": "19:19", "lines": [{"level": 0, "text": "連續示範全場（正手＋反手）封網動作"}, {"level": 0, "text": "說明若球不遠、不平，可直接站姿擊球無需額外調整"}, {"level": 0, "text": "若對方抽得又快又重，仍需適度後退"}]}]}, {"category": "步伐教學", "num": 43, "title": "43.雙打混雙後場4點跑位步伐", "tags": [{"tag": "後場殺球／抽球循環步法（核心且最直接的內容）", "reason": "00:00–03:35，反覆示範殺-抽-回-殺的平行啟動循環"}, {"tag": "殺球節奏最快，優先練習", "reason": "04:12–04:35，說明為何雙打後場練習以殺球為主，吊球為輔"}, {"tag": "隨機殺／抽混合訓練", "reason": "03:00–03:55，可自由組合殺球或抽球練習節奏感"}, {"tag": "吊球回位方式（交叉走或並步）", "reason": "04:03–04:47，吊球回位與殺球回位略有不同，但選練與否皆可"}, {"tag": "雙打套路／輪跑戰術簡介（非純步法，屬進階內容）", "reason": "05:14–08:53，示範殺、抽、上網的輪轉跑位，強調需先達一定程度才練"}, {"tag": "對腳／對角殺抽變化練習", "reason": "01:14–02:33，加入方向變化的練習方式"}, {"tag": "中場偏高球可直接跳殺（不需反拍）", "reason": "02:00–02:20，簡述另一種處理選擇"}], "segments": [{"heading": "開場與後場步法總論", "start": "00:00", "end": "01:14", "lines": [{"level": 0, "text": "後場步法延續前面課程原則，特別直接：殺球/抽球/回位循環"}, {"level": 0, "text": "殺完必為平行啟動，接抽球，再回位平行啟動殺球，如此循環"}]}, {"heading": "對角殺抽與方向變化", "start": "01:14", "end": "02:33", "lines": [{"level": 0, "text": "加入殺/抽對角變化練習，示範對腳（同側）與對角組合"}, {"level": 0, "text": "提及中場球偏高時可直接跳起殺球，不必用反拍處理"}]}, {"heading": "隨機殺抽混合練習", "start": "02:33", "end": "03:55", "lines": [{"level": 0, "text": "可自由穿插殺球、抽球節奏，讓練習更貼近實戰"}]}, {"heading": "吊球回位方式與練習必要性", "start": "03:55", "end": "04:47", "lines": [{"level": 0, "text": "吊球回位可用並步或交叉走一步再平行啟動"}, {"level": 0, "text": "雙打實戰中很少用吊球（因殺球節奏更快、更符合雙打快速對抗需求），此處練習可選可不選"}, {"level": 0, "text": "頭頂吊球回位方式與殺球相同"}]}, {"heading": "雙打套路／輪轉跑位示範（進階內容）", "start": "04:47", "end": "08:53", "lines": [{"level": 0, "text": "示範保持連續進攻情境下的跑位：殺球後上網，搭檔補後場，兩人輪替角色"}, {"level": 0, "text": "強調此為「套路」而非純步法，須達到一定實力（能連續進攻）才需要練習"}, {"level": 0, "text": "需兩人配合，且擊球質量要求高（不能出軟球被對方直接得分）"}]}, {"heading": "收尾：轉向學習分開站防守情境", "start": "08:53", "end": "11:28", "lines": [{"level": 0, "text": "說明保持進攻情況下的跑位已教完"}, {"level": 0, "text": "銜接下一集：起球後如何回中、分開站、對方掉球時如何接網前球、後場球處理方式"}]}]}, {"category": "步伐教學", "num": 44, "title": "44.雙打混雙防守站法步伐【步伐最後一節 淚目】", "tags": [{"tag": "分開站（防守站位）核心步法：斜站＋各方向啟動", "reason": "00:00–13:23，全片主軸，示範前場/中場/後場各方向的防守回位步法"}, {"tag": "斜站（非平行站）原因與反拍握法配合", "reason": "00:59–02:58，說明為何防守時右腿略往後斜站，方便用反拍防守"}, {"tag": "何時分開站／何時前後站的判斷邏輯", "reason": "00:00–00:59、07:17–13:23，依「起球」vs「進攻」切換陣型的規則說明"}, {"tag": "混雙女生站前場的處理與訓練建議", "reason": "16:56–24:36，本片情感highlight「淚目」段落，針對女生前場不擅退防的教學建議"}, {"tag": "平抽情境下的前後站例外", "reason": "09:31–12:04，特殊球路〔平抽對抗〕時陣型會臨時變成前後站"}, {"tag": "雙打步伐總結與練習組合建議", "reason": "26:03–33:00，整合往前/中場/後場步伐的訓練菜單"}, {"tag": "混雙男方純單打步伐處理（當女方不退防時）", "reason": "24:36–26:03，說明男方需獨自負擔後場如同打單打"}, {"tag": "弓箭步／轉身動作為雙打全部步法根基", "reason": "13:23–16:56，回顧並強調往前弓箭步、後場轉身動作的重要性"}], "segments": [{"heading": "分開站防守的基本原理與站姿", "start": "00:00", "end": "02:58", "lines": [{"level": 0, "text": "分開站（防守站位）目的：準備防對方殺球"}, {"level": 0, "text": "何時分開站：前場人起球後直接退，或後場人打完高遠球後往中間走一步準備平行防守"}, {"level": 0, "text": "站姿：非完全平行，而是斜站（右腿在後、左手在前），原因："}, {"level": 1, "text": "配合反拍握法，方便對殺到自身正手側的球做防守動作"}, {"level": 1, "text": "避免正面對殺時打到自己的腿"}]}, {"heading": "分開站後各方向回位步法（核心示範）", "start": "02:58", "end": "07:17", "lines": [{"level": 0, "text": "後場高遠球回位：啟動→平行接球"}, {"level": 0, "text": "對方吊球：右腿發力直接推、跳起接（重複示範前場/後場方向）"}, {"level": 0, "text": "對方掉球（網前小球）：右腿發力挪重心至左腿，做弓箭步上網"}, {"level": 0, "text": "半場防守步法本質上是「全場步伐」的縮小版，套用相同的啟動與弓箭步原理"}]}, {"heading": "分開站 vs 前後站的切換規則", "start": "07:17", "end": "09:31", "lines": [{"level": 0, "text": "只要「對方起球」（打高球），雙方各自回自己半邊＝分開站"}, {"level": 0, "text": "只要「其中一人擋網或往下打」（進攻）＝立刻換成前後站"}, {"level": 0, "text": "換站時機：不是等自己打完才換，而是看到對方起球那一刻就要開始移動換位"}]}, {"heading": "平抽對抗的特殊情境（前後站例外）", "start": "09:31", "end": "13:23", "lines": [{"level": 0, "text": "當雙方在半場位置打「平抽」（球出得不高、對手無法下壓）時，會臨時採前後站"}, {"level": 0, "text": "因為出球高度有限，對方只能抽球回擊，己方可提前卡位準備連續抽球"}, {"level": 0, "text": "一旦轉為擋網或進攻，立即變回前後站的標準模式"}]}, {"heading": "弓箭步與轉身動作是雙打步法根基", "start": "13:23", "end": "16:56", "lines": [{"level": 0, "text": "強調：往前最重要是「弓箭步」，後場最重要是「轉身動作」"}, {"level": 0, "text": "這兩個單打已教過的動作若做對，即使來不及起球也能勉強擋網"}, {"level": 0, "text": "提及不少女學員上網慢的問題根源多出在弓箭步不到位，而非步法概念錯誤"}]}, {"heading": "混雙女生防守與訓練建議（情感重點段落）", "start": "16:56", "end": "26:03", "lines": [{"level": 0, "text": "若女生會退防、會打後場高遠球、會接吊球，即可放心讓她退防，男方不需擔心"}, {"level": 0, "text": "建議訓練流程：先練兩點防線（半場平行站+並步+跳），再加後場高遠球，逐步建立信心"}, {"level": 0, "text": "若女生選擇固定站前場不退（純套路打法），則無步法可教，純粹是戰術選擇；此時需搭配對應打法（例如男方需承擔更大範圍）"}, {"level": 0, "text": "若女生仍不擅長退防，男方基本上須以單打步伐處理全場（啟動、轉身、過渡步伐）"}]}, {"heading": "雙打步伐總複習與練習菜單", "start": "26:03", "end": "32:00", "lines": [{"level": 0, "text": "前場：平行啟動、並一步找重心腿、啟動打球，20次一組"}, {"level": 0, "text": "中場：抽球練習，強調抬手勿放太低，弓箭步落地與壓球同時"}, {"level": 0, "text": "後場：吊球（左右各一步或先進一步再平行啟動）、殺球（直接平行啟動轉身殺）"}, {"level": 0, "text": "半場防守四點步法：平行啟動、並步、跳，可用並步或交叉步回位（依落點遠近選擇）"}]}, {"heading": "收尾：步伐課程總結與後續預告", "start": "32:00", "end": "33:19", "lines": [{"level": 0, "text": "總結：雙打步伐本質上是單打步伐的簡化版，因節奏快而做了精簡"}, {"level": 0, "text": "提醒尚未看單打步伐理論知識的學員務必先看"}, {"level": 0, "text": "預告後續會更新內容（如逾越防守、Q&A解答），步伐系列課程至此告一段落"}]}]}, {"category": "殺球高遠球合集", "num": 1, "title": "1.目錄（先看這個！）", "tags": [{"tag": "課程導覽", "reason": "00:00–00:56，說明整套殺球網課共8小時，目錄影片幫助學員找到對應章節"}, {"tag": "字幕製作進度說明", "reason": "00:55–02:11，解釋部分影片暫無字幕、1~2週內會補上"}, {"tag": "自學導向的教學理念", "reason": "00:19–01:46，強調課程目的是讓學員能自學、解決所有常見問題"}, {"tag": "社群/微信群預告", "reason": "02:11–02:39，之後會提供二維碼加入群組互相討論提問"}], "segments": [{"heading": "開場與課程介紹", "start": "00:07", "end": "01:46", "lines": [{"level": 0, "text": "說明這是一套完整的殺球/高遠球網課，共8小時"}, {"level": 0, "text": "目的不只是教動作，更是回答學員長年累積的各種問題"}, {"level": 0, "text": "強調課程的最終目標：讓學員能夠自學，從不會殺球到打得很好"}, {"level": 0, "text": "因平台限制需分段上傳，此為目錄，方便之後查找對應主題（例如手指發力對應哪一集）"}]}, {"heading": "字幕與後續安排說明", "start": "01:46", "end": "02:39", "lines": [{"level": 0, "text": "部分影片暫時沒有字幕，並非遺漏，而是不想讓學員等待，先上架後續1~2週內補上"}, {"level": 0, "text": "之後會提供加入微信群的方式，方便學員互相討論、提問、上傳影片求指導"}]}]}, {"category": "殺球高遠球合集", "num": 2, "title": "2.1）網課握拍", "tags": [{"tag": "正確握拍法（Common Grip / V字握法）", "reason": "05:49–08:34，示範食指與拇指分居兩個框面、虎口位置、握法目的在於發力與拍面擺正"}, {"tag": "握拍的目的與錯誤示範", "reason": "06:16–06:54，說明握拍錯誤會導致拍面無法擺正、發不了力"}, {"tag": "握拍種類比較（正常/李宗偉/桃田/低握）", "reason": "08:36–10:59，四種握法的虎口位置差異與適用性"}, {"tag": "握拍常見錯誤", "reason": "11:00–12:44，食指過度外翹、手指未貼合框面導致發力時脫拍"}, {"tag": "課程整體架構鋪陳", "reason": "00:00–00:49，說明學習順序：握拍→揮拍→轉身→節奏→空間感"}, {"tag": "後場動作（高遠球/殺球/吊球）示範對比", "reason": "00:00–02:23，業餘與專業球員動作僵硬程度對比，帶出腰部發力概念"}, {"tag": "腰部作為連接上下半身的重要性", "reason": "02:33–04:05，簡述後續會詳細教"}], "segments": [{"heading": "課程總覽與學習地圖", "start": "00:00", "end": "00:49", "lines": [{"level": 0, "text": "本集主題：殺球、吊球、高遠球等後場動作"}, {"level": 0, "text": "對比業餘與專業球員動作差異：專業球員動作舒展、放鬆、易發力"}, {"level": 0, "text": "提出完整學習路徑：動作（握拍→揮拍）→節奏（轉身/移動）→空間感"}]}, {"heading": "握拍目的與正確握法", "start": "04:48", "end": "08:34", "lines": [{"level": 0, "text": "學習動作前必須先學握拍，因為握拍正確才能發力並讓拍面擺正"}, {"level": 0, "text": "球拍共8個面：2個框面、2個側稜、4個斜稜"}, {"level": 0, "text": "正確握法（Common Grip / V字握法）"}, {"level": 1, "text": "像握手一樣，拇指略低於食指"}, {"level": 1, "text": "食指置於一個框面，拇指與另外三指置於另一框面"}, {"level": 1, "text": "虎口位於側稜與斜稜之間，留一點空隙"}, {"level": 1, "text": "食指用近指節骨頭處按壓，拇指用骨頭處或稍內側"}]}, {"heading": "握拍種類比較", "start": "08:36", "end": "10:59", "lines": [{"level": 0, "text": "第二種握法：虎口稍微往內移，靠近斜稜（類似李宗偉握法）"}, {"level": 0, "text": "蒼蠅拍握法（類似陶菲克）：虎口在右側側稜，很多雙打選手偏好，因為感覺較正、適合殺球"}, {"level": 0, "text": "低握法：拇指與四指位置較低，較放鬆"}, {"level": 0, "text": "四種握法皆能讓拍面擺正，差異在於發力細節與適合的球路"}]}, {"heading": "錯誤握拍與常見問題", "start": "11:00", "end": "12:44", "lines": [{"level": 0, "text": "錯誤示範：食指抬得過高，發力時拍面易鬆脫、無法擺正"}, {"level": 0, "text": "四指未貼合框面或拇指位置不對，皆會導致發力時球拍鬆脫或打歪"}, {"level": 0, "text": "常見錯誤握法：像握斧頭/木材一樣拇指疊在食指上，導致拍面無法擺正、易切球"}]}, {"heading": "揮拍動作的重要性總結", "start": "12:44", "end": "13:43", "lines": [{"level": 0, "text": "揮拍是所有技術（殺球、吊球、高遠球、反拍）的根本，動作必須先對，才能談節奏與腰部發力"}, {"level": 0, "text": "不同握法在揮拍時的技術細節略有不同，將在後續詳細說明"}]}]}, {"category": "殺球高遠球合集", "num": 3, "title": "3.2）揮拍（1）", "tags": [{"tag": "抬頭看球的重要性", "reason": "02:53–06:36，強調揮拍全程必須抬頭看球，否則無法用腰、無法加速"}, {"tag": "「扔東西」類比解釋身體結構與發力方向", "reason": "07:24–13:13，用生活中扔東西的動作說明為何手臂發力方向固定朝前上方"}, {"tag": "常見錯誤揮拍動作糾正（腦後打球/找茬貨式）", "reason": "00:45–02:53、10:53–11:16，示範最多人犯的錯誤：手在腦後完成動作、不抬頭"}, {"tag": "正確站位與架拍步驟（1-2-3-4分解）", "reason": "19:05–21:45，左腳在前、右腳在後、架拍90度、左手上抬"}, {"tag": "假拍（架拍）與引拍（拉弓）動作介紹", "reason": "22:46–29:29，示範架拍與引拍/假拍的分解動作"}, {"tag": "成人學習應理性理解動作原理，而非死記模仿小孩", "reason": "16:02–17:44，說明為何小孩子亂打也能練好、成人需要理解原理才能練對"}, {"tag": "肘部位置與收拍/推小臂細節", "reason": "29:29–34:50，肘不要貼耳朵、小臂不夾緊、推食指使拍面擺平"}], "segments": [{"heading": "引言：對上一集握拍的銜接", "start": "00:00", "end": "00:33", "lines": [{"level": 0, "text": "已學會握拍，接下來學會拍（揮拍），是第二個要學習的核心動作"}, {"level": 0, "text": "會先示範正確動作，再說明常見錯誤，最後逐步驟拆解教學"}]}, {"heading": "常見錯誤揮拍示範一：手部全程在腦後完成", "start": "00:33", "end": "06:36", "lines": [{"level": 0, "text": "很多人練習時「一二三四」全程不抬頭、手在腦後完成動作"}, {"level": 0, "text": "問題1：不合乎人體結構，實戰時一旦要抬頭看球，動作會完全跑掉，肌肉不熟悉"}, {"level": 1, "text": "不抬頭無法用腰，腰是連接上下半身唯一的大肌肉"}, {"level": 0, "text": "問題2：手在腦後做動作無法加速，因為身體結構決定發力方向必須朝前上方"}, {"level": 1, "text": "用「扔東西」類比：人扔東西時手臂自然朝前方／頭部方向，不會往後扔"}, {"level": 1, "text": "打高遠球時應該是「抬頭看、身體後仰、往前上方發力」，而非在腦後完成整個揮拍"}]}, {"heading": "為何要抬頭：用生活動作類比解釋身體結構限制", "start": "07:24", "end": "15:23", "lines": [{"level": 0, "text": "用「扔東西」示範：往前看時手自然朝前扔，往下看時扔不遠"}, {"level": 0, "text": "如果不抬頭，等同於在做一個不合理、不符合人體結構的動作"}, {"level": 0, "text": "很多人因為覺得引拍（架拍/引拍動作）彆扭，乾脆放棄，直接在身體前方隨便打，如同「找柴刀」式打法，力量不足"}]}, {"heading": "為何成人需要理解原理，而非像小孩一樣模仿練", "start": "15:23", "end": "17:44", "lines": [{"level": 0, "text": "有人質疑：小孩子動作也是「腦後打」為何也能打好？"}, {"level": 0, "text": "解釋：小孩無意識中經過大量重複練習會自然修正動作；成人因為習慣按照固定步驟練，若練錯反而根深蒂固，需要理解原理主動修正"}]}, {"heading": "正確揮拍逐步驟教學（1-2-3-4分解）", "start": "17:44", "end": "29:29", "lines": [{"level": 0, "text": "站位：左腳在前，右腳在後，側身（測身）留出擊球空間與加速距離"}, {"level": 0, "text": "步驟一：架拍"}, {"level": 1, "text": "右手抬起，肘部約90度或略小，不需刻意90度"}, {"level": 1, "text": "目的：拉開肩胛骨，像拉弓一樣"}, {"level": 1, "text": "左手同時抬起，略高於右手，用來瞄球"}, {"level": 1, "text": "頭往上看，重心移至右腿後方，左腳跟微抬起（為後續轉身做準備）"}, {"level": 0, "text": "假拍（架拍）姿勢：挺胸、背部打直、往上看"}]}, {"heading": "引拍（拉弓）動作與內旋原理", "start": "29:29", "end": "34:50", "lines": [{"level": 0, "text": "第二動作：拉左手，感覺兩側肩胛骨向內夾緊、胸略挺、腰略停頓（不要誇張）"}, {"level": 0, "text": "左手放下頂到肩胛骨後，帶動右肘往前上（朝嘴巴/鼻子/眼睛高度）"}, {"level": 0, "text": "手腕自然往後倒（放鬆式），如同扔東西的動作"}, {"level": 0, "text": "收拍要點：肘部不要貼耳朵（否則球會打歪，且需額外轉身動作才能出球）；小臂不要夾得太緊，需留一點空間讓手腕自然後倒"}]}]}, {"category": "殺球高遠球合集", "num": 4, "title": "4.3）揮拍（2）", "tags": [{"tag": "步驟三與四：推小臂+內旋+收拍完整示範", "reason": "00:00–02:34，示範完整揮拍連貫動作並強調對鏡子練習"}, {"tag": "問題解答：架拍朝內或朝外", "reason": "05:24–13:56，回答學員最常問的架拍方向問題，解釋為何自然朝外更利於發力"}, {"tag": "為何一定要做內旋動作（核心力學原理）", "reason": "20:01–25:00，用身體結構解釋內旋是為了同時做到「平」「正」「能發力」"}, {"tag": "架拍高度與角度問答", "reason": "12:40–16:36，回答架拍要多高、多大、球在何處"}, {"tag": "左手抬多高的問答", "reason": "14:24–15:46，解釋左手的作用是瞄球、幫助重心後移、幫助發力"}, {"tag": "為何揮拍容易打歪的原理解析", "reason": "25:28–29:45，用扔東西過網袋類比，解釋腦後打球必歪的原因"}, {"tag": "側身角度與引拍大小的問答", "reason": "15:48–19:26，側身不需太多、引拍太大反而導致擊球點錯過或發不了力"}, {"tag": "收拍動作是否要刻意做（比劃/滑向左邊等）", "reason": "29:29–36:00，強調不要刻意做收拍動作，自然放下即可"}], "segments": [{"heading": "完整揮拍動作連貫示範", "start": "00:00", "end": "03:46", "lines": [{"level": 0, "text": "示範完整「一二三四」揮拍動作：架拍、往上看、拉肩、放下手腕自然後倒"}, {"level": 0, "text": "建議對著鏡子練習，比對自己的動作是否與教練一致"}, {"level": 0, "text": "連貫動作時，下一步驟的手臂其實已經開始朝下一個方向移動，並非等上一步驟完全結束才開始"}]}, {"heading": "問答：架拍朝內或朝外", "start": "05:24", "end": "13:56", "lines": [{"level": 0, "text": "一般教練教法：架拍要拍面朝前，導致需要額外做小臂內旋動作擺平"}, {"level": 0, "text": "作者自身習慣：架拍自然朝外（側身時自然形成），無需刻意做動作"}, {"level": 0, "text": "說明架拍朝外/朝前皆可行，唯一不可以做的是「手腕往外翻」導致的動作，會導致100%切球、發不了力"}, {"level": 0, "text": "建議手腕不要主動做多餘動作，讓其自然狀態最容易做出內旋、發力"}]}, {"heading": "問答：架拍要架多大", "start": "12:40", "end": "16:36", "lines": [{"level": 0, "text": "90度或略小皆可，太大會導致到球下方還需再開啟，太彆扭"}, {"level": 0, "text": "關鍵在於抬頭看球時，拍面自然會呈現正確角度"}]}, {"heading": "問答：左手要抬多高", "start": "14:24", "end": "15:46", "lines": [{"level": 0, "text": "左手作用：瞄球、幫助引拍時頂肩胛骨挺胸、是轉身發力的一部分"}, {"level": 0, "text": "左手帶動重心往後，如同扔東西時重心必須壓在後腿"}, {"level": 0, "text": "不需抬太高，抬高過手即可"}]}, {"heading": "問答：側身要側多少", "start": "15:48", "end": "19:56", "lines": [{"level": 0, "text": "側身不需要太誇張，差不多打平即可，球應在右上方一點（因為右撇子）"}, {"level": 0, "text": "若把球放在正中間打，轉身角度會不對導致打歪"}]}, {"heading": "問答：引拍是否越大越好發力", "start": "16:58", "end": "20:01", "lines": [{"level": 0, "text": "否，引拍太大會導致球過人、失去時機，只能在頭後方打球，反而失去加速空間"}, {"level": 0, "text": "電視上看到的\"大引拍\"其實是手腕自然後倒造成的視覺錯覺，實際手部動作幅度並不大"}]}, {"heading": "為何必須做內旋動作：身體結構原理", "start": "20:01", "end": "25:00", "lines": [{"level": 0, "text": "用手臂在身體不同位置示範：\"在腦門前方\"才能同時做到\"平\"、\"正\"、\"能發力\""}, {"level": 0, "text": "若在腦門後方勉強擺平，會導致切球、發不了力"}, {"level": 0, "text": "因此解釋了為何一定要抬頭、球要在腦門前方處理"}]}, {"heading": "為何揮拍容易打歪：扔東西過網袋類比", "start": "25:28", "end": "29:45", "lines": [{"level": 0, "text": "用扔東西過網袋類比：眼睛向前看時手臂自然發力方向偏斜（導致球歪）"}, {"level": 0, "text": "正確做法：抬頭看球，彎腰，讓身體朝向擊球方向，才能保證揮拍是直的"}, {"level": 0, "text": "球應放在右邊而非正中間或頭頂，否則必然打歪或需繞頭動作（最不合理）"}]}, {"heading": "收拍相關問答", "start": "29:52", "end": "36:00", "lines": [{"level": 0, "text": "收拍時看起來\"手繞一圈\"其實是手腕自然內收+推食指內旋所致，不需要刻意去做"}, {"level": 0, "text": "太早或刻意做收拍轉動作，會導致提前切球或減速"}, {"level": 0, "text": "收拍力道大小與是否偏斜，取決於推食指內旋的用力程度，無需刻意控制方向"}]}]}, {"category": "殺球高遠球合集", "num": 5, "title": "5.4）揮拍（3）+問題解答", "tags": [{"tag": "發力核心原理問答（大臂/小臂/手腕/放鬆抓緊）", "reason": "00:00–24:00，本集核心，完整解釋發力鏈條：肩→肘→小臂→手腕→手指，以及放鬆抓緊的時機"}, {"tag": "握拍位置與手指放鬆抓緊機制", "reason": "08:20–14:30，詳解手指握拍在哪個位置、如何放鬆再抓緊完成加速"}, {"tag": "何時抓緊：依球速快慢調整時機", "reason": "18:00–22:15，慢球可碰到球才抓緊，快球需提前抓緊，否則切球"}, {"tag": "引拍繞一圈問題（大引拍的成因與危害）", "reason": "22:19–25:23，說明繞圈是因為先倒手腕而非直接上手臂"}, {"tag": "練習方法示範（分解練習、拋球練習、朋友餵球）", "reason": "29:29–41:00，具體練習步驟：定點分解、掛球練習、朋友拋球練習"}, {"tag": "不同握法（李宗偉/陶菲克）之揮拍差異", "reason": "40:43–45:00，握法不同時架拍/引拍角度需微調"}, {"tag": "收拍是否要刻意（提前壓腰、太晚太早的後果）", "reason": "25:53–29:29，說明太早收拍會切球，收拍角度自然形成即可"}, {"tag": "本集後續銜接：進入轉身/節奏學習", "reason": "45:00–46:31，總結揮拍已完成，下一步學轉身"}], "segments": [{"heading": "發力原理總覽問答", "start": "00:00", "end": "07:37", "lines": [{"level": 0, "text": "發力不是靠「大臂」或「小臂」單一部位，而是整個連貫動作的加速甩動"}, {"level": 0, "text": "一定要用手腕：不用手腕會導致內旋動作困難、切球、速度慢"}, {"level": 0, "text": "手腕是否要壓：會壓到，但方法要對——是斜向朝外壓，而非在身體正中間死壓（否則會導致手腕受傷）"}]}, {"heading": "手腕放鬆與抓緊的原理", "start": "07:37", "end": "14:30", "lines": [{"level": 0, "text": "發力 = 用力 = 緊，但發力前必須先放鬆手指，才能讓手腕自然後倒"}, {"level": 0, "text": "放鬆的僅是「手指」，不是全身放鬆（全身放鬆是錯誤理解）"}, {"level": 0, "text": "握拍位置在手指這一節（非手掌），拇指頂住，其餘三指放鬆留空間"}, {"level": 0, "text": "加速鏈條：肘→小臂→手腕→手指，每個關節都要用上以達到最大加速"}]}, {"heading": "何時抓緊：依球速調整時機", "start": "14:30", "end": "22:15", "lines": [{"level": 0, "text": "若對方來球慢（高遠球/發球）：可以在碰到球後才快速抓緊"}, {"level": 0, "text": "若對方來球快（平球/平高球）：必須在碰球前就提前抓緊，因為空間和時間都不夠"}, {"level": 0, "text": "抓太早等同於打點提前，會導致失誤；抓太晚會被球速壓住拍面而切球"}]}, {"heading": "「邊打」效果與收拍問題", "start": "22:15", "end": "29:29", "lines": [{"level": 0, "text": "「邊打」（甩鞭式）並非刻意動作，而是所有動作做對後自然產生的視覺效果"}, {"level": 0, "text": "引拍繞一圈是因為「先倒手腕」而非直接抬手甩出，屬於錯誤動作，容易錯過擊球點、切球"}, {"level": 0, "text": "是否需要「搶高點」：本質上就是避免在腦後低位打球的委婉說法，非額外技巧"}, {"level": 0, "text": "收拍角度自然偏斜是因為推食指內旋所致，不必刻意控制方向，也不需要提前壓腰（否則減速、切球）"}]}, {"heading": "具體練習方法", "start": "29:29", "end": "41:00", "lines": [{"level": 0, "text": "分解慢動作練習：一步步做「架拍→拉左肩→推手腕→放鬆抓緊」"}, {"level": 0, "text": "掛球練習法：吊一顆球在右前方定點，重複揮拍去碰"}, {"level": 0, "text": "朋友拋球練習法：請朋友拋球，自己配合抬頭、挺腰、揮拍去接"}, {"level": 0, "text": "強調千萬不要在腦後、身體僵直狀態下練習加速，會導致動作定型錯誤"}]}, {"heading": "不同握法的揮拍差異", "start": "40:43", "end": "45:00", "lines": [{"level": 0, "text": "李宗偉式握法（虎口偏內）：架拍角度略朝下，需往外多推一點以擺平；適合做切球/劈球"}, {"level": 0, "text": "陶菲克式握法（蒼蠅拍/虎口偏右側稜）：架拍角度略朝上，擺平速度快，適合殺球，但容易因內旋過度變成劈殺或滑板動作"}]}, {"heading": "總結與銜接下一課", "start": "45:00", "end": "46:31", "lines": [{"level": 0, "text": "揮拍（動作）已完成教學，接下來要學節奏（轉身），即如何在移動中借力、回位"}]}]}, {"category": "殺球高遠球合集", "num": 6, "title": "6.5）轉身（1）", "tags": [{"tag": "正確轉身核心原理：先拉左手帶動左腿，形成反方向腰部力量", "reason": "12:12–19:36，本集核心，用卡片比喻解釋轉身如何借用腰部力量"}, {"tag": "常見錯誤轉身糾正：同步發力/往前邁", "reason": "01:26–08:20，最多人犯的錯誤，右腿右手同時出，導致無法發力也無法回位"}, {"tag": "確認步與右腿找球", "reason": "21:45–24:56，說明如何用右腿定位球的落點，並用平衡器比喻解釋重心壓右腿的重要性"}, {"tag": "轉身的目的（發力+協調+易回位）", "reason": "08:20–12:12，說明轉身要同時達成三個目標"}, {"tag": "平衡器比喻：重心位置決定可用力量空間", "reason": "25:32–28:47，重心在右腿時，左邊才有空間發力"}, {"tag": "完整轉身動作分解（X交叉發力模式）", "reason": "28:47–31:17，右腿發力→動左手→帶動左腿→動右手→帶動右腿，形成交叉節奏"}, {"tag": "不能先動右腿/先彎腰/先動右手等替代方案的錯誤示範", "reason": "00:41–06:15，逐一排除各種\"先動其他部位\"的可能性"}], "segments": [{"heading": "引言：轉身與揮拍的關係", "start": "00:00", "end": "01:26", "lines": [{"level": 0, "text": "轉身 = 移動版的揮拍，因為打球時幾乎不會剛好站在定點，一定需要移動"}, {"level": 0, "text": "轉身要達成的目標：能借力發力、動作協調不僵硬、打完容易回位"}]}, {"heading": "常見錯誤轉身：同步發力/往前邁", "start": "01:26", "end": "08:20", "lines": [{"level": 0, "text": "最多業餘球員的錯誤：右腿與右手同時往前出（同步發力），看似有轉身動作，實際上發不了力"}, {"level": 0, "text": "錯誤原因1：後場球不可能往前邁右腿，實際應該是左腿往後撤"}, {"level": 0, "text": "錯誤原因2：同步發力不符合人體結構（用跑步/扔東西類比：一定是交叉用力才快、才有力）"}, {"level": 0, "text": "另一種錯誤：提前做轉身或完全不轉身，直接用左腿站定硬打，會導致回不了位"}]}, {"heading": "轉身的目的：能用上腰", "start": "08:20", "end": "12:12", "lines": [{"level": 0, "text": "轉身本質是為了用上腰——腰是連接上下半身、傳導力量的最大肌肉之一"}, {"level": 0, "text": "沒有腰的傳導，力量會在腰部「卡住」，只能單靠雙手打球"}, {"level": 0, "text": "示範對比：有無使用腰部轉身，力量差異明顯"}]}, {"heading": "核心原理：先拉左邊再放右邊（卡片比喻）", "start": "12:12", "end": "19:36", "lines": [{"level": 0, "text": "錯誤理解：把左邊當軸心不動，右邊直接往前甩——這樣沒有力量（用卡片示範推力不足）"}, {"level": 0, "text": "正確方法：先往反方向拉左邊，再讓右邊往前放，力道明顯更強（如拉弓）"}, {"level": 0, "text": "進一步解釋：真正的轉身力量來源不只是「右到左」的橫向力，還包含「後到前」的縱向力（用扔東西示範：站左腿蓄力、扭腰再扔出去）"}, {"level": 0, "text": "完整力量 = 左右反方向力 + 前後力，才能用上全身（雙手雙腿）力量"}]}, {"heading": "確認步：如何找球", "start": "19:36", "end": "24:56", "lines": [{"level": 0, "text": "用並步移動到位，不是用頭去找球（否則會發不了力、打不到球）"}, {"level": 0, "text": "用右腿去找球：右腿要稍微超過球一點點，讓球落在腦門前方"}, {"level": 0, "text": "並步開合大小依球高度調整：球高則可跑到位、開小一點；球低則來不及，需開大一點"}]}, {"heading": "重心轉換與平衡器比喻", "start": "24:56", "end": "28:47", "lines": [{"level": 0, "text": "為何重心一定要壓在右腿而非中間或左腿：用平衡器比喻，重心在右腿時左邊才有更大空間發力"}, {"level": 0, "text": "到位後動作順序：架拍→挺胸→抬左手瞄球，全部以重心壓右腿為前提"}]}, {"heading": "完整轉身分解教學（X交叉動作）", "start": "28:47", "end": "31:17", "lines": [{"level": 0, "text": "第一動作：拉左手，感覺肩胛骨往內擠、右邊仍拉著"}, {"level": 0, "text": "帶動左腿收起、往後撤，但右邊腰部仍然繃住（不能提前放鬆）"}, {"level": 0, "text": "左腿踏地時，動右手完成甩拍動作，右腿隨之抬起回位"}, {"level": 0, "text": "整個過程形成「X」交叉節奏：右腿發力→動左手→帶動左腿→踏地時動右手→帶動右腿"}]}]}, {"category": "殺球高遠球合集", "num": 7, "title": "7.6）轉身（2）+問題解答", "tags": [{"tag": "為何一定要先動左手（拆解各種替代順序為何都錯）", "reason": "00:00–04:00，逐一測試先動左腿/右腿/腰/右手的後果，證明順序的必要性"}, {"tag": "平行站分解練習法（最有效練習）", "reason": "04:06–13:00，本集最詳細示範的核心練習方法"}, {"tag": "右腿為何要抬起（重心轉換帶動前進）", "reason": "04:06–07:18，解釋抬右腿並非拖地，而是重心轉換的自然結果"}, {"tag": "跳躍時機與落地順序（左腿先落地原則）", "reason": "14:53–20:00，說明何時可以跳、跳多高、落地順序規則"}, {"tag": "練習銜接與加速（分解→連貫→加快）", "reason": "21:00–27:52，從慢動作過渡到實戰速度的方法"}, {"tag": "不要提前壓腰的糾正", "reason": "21:31–24:32，強調全程挺腰直到甩拍瞬間才釋放"}, {"tag": "拉弓比喻：兩個弓的力量來源", "reason": "11:42–13:00，用兩段弓的比喻解釋轉身力量結構"}, {"tag": "確認步開合大小與球高度的關係", "reason": "22:44–24:47，開合大小依來球位置調整"}, {"tag": "全片總結與課程銜接（進入高遠球/殺球/吊球）", "reason": "31:27–35:00，回顧所有問題已解答，銜接下一階段課程"}], "segments": [{"heading": "為何一定要先動左手：逐一排除其他順序", "start": "00:00", "end": "04:00", "lines": [{"level": 0, "text": "若先動左腿：轉身幅度不足，上半身仍是平的，重心未轉換，發不了力"}, {"level": 0, "text": "若先動右腿：腰無法用上，腰部會受到過大刺激（類似拉傷風險）"}, {"level": 0, "text": "若直接彎腰動腰：會提前壓腰，導致擊球點退到腦後"}, {"level": 0, "text": "若直接動右手：全身無法轉動"}, {"level": 0, "text": "若左手未放下：重心仍在後方，無法出手"}, {"level": 0, "text": "結論：必須先拉左手→帶動左腿→腰部反方向繃緊→最後才甩拍，形成交叉（X）力量模式"}]}, {"heading": "平行站分解練習法（最重要的練習）", "start": "04:06", "end": "13:00", "lines": [{"level": 0, "text": "平行站，右手架拍，做側身，重心到右腿"}, {"level": 0, "text": "拉左手頂肩胛骨，能感覺到反方向的腰部張力"}, {"level": 0, "text": "甩拍：因為平行站不需要動左腿，直接感受腰部發力"}, {"level": 0, "text": "甩拍後重心轉到左邊，右腿自然收起一點（重心轉換的證明）"}, {"level": 0, "text": "作者稱此為「暫時最有效的練習」，建議學員反覆做這個動作以感受從未體驗過的腰部力量"}]}, {"heading": "右腿抬起原理與重心轉換視覺化", "start": "04:06", "end": "07:18", "lines": [{"level": 0, "text": "右腿並非「拖地」動作，而是「抬起」——因為重心壓右腿，甩拍後會自然帶重量壓下並推動人往前跑"}, {"level": 0, "text": "動作快時，抬腿幅度不明顯，但原理不變，落地即用腳尖迅速回位"}]}, {"heading": "拉弓比喻：兩段弓的概念", "start": "11:42", "end": "13:00", "lines": [{"level": 0, "text": "第一個弓：拉左邊（架拍/引拍時的張力）"}, {"level": 0, "text": "第二個弓：身體從側身到甩拍瞬間形成的另一段張力"}, {"level": 0, "text": "兩段弓依序釋放，才是完整力量來源"}]}, {"heading": "跳躍時機與落地順序規則", "start": "14:53", "end": "20:00", "lines": [{"level": 0, "text": "做確認步時不可用腳跟，必須用腳尖（腳跟無法發力、無法連貫）"}, {"level": 0, "text": "只有在左手已經拉下、開始帶動左腿之後，右腿才可以起跳；不可提前跳（否則等同同步發力，腰沒用上）"}, {"level": 0, "text": "落地順序：一定是左腿先落地，右腿後落地；即使被動、匆忙也應盡量保持此順序，才能保證回位速度"}, {"level": 0, "text": "跳的高度可依個人能力增加，步驟原理不變"}]}, {"heading": "確認步大小與提前壓腰的糾正", "start": "20:00", "end": "24:47", "lines": [{"level": 0, "text": "千萬不要提前壓腰：應全程挺腰，直到甩拍瞬間腰才自然釋放（如拉弓放箭）"}, {"level": 0, "text": "拉左手時不可以往外拉，否則會被帶離擊球點"}, {"level": 0, "text": "確認步開合大小依球的距離與高度調整：球高則可開小一點（有時間等球），球低則需開大一點（趕緊到位）"}]}, {"heading": "連貫練習與加速方法", "start": "21:00", "end": "29:29", "lines": [{"level": 0, "text": "先分解慢動作練習（右-左-右-左重心轉換，再加上前後方向）"}, {"level": 0, "text": "熟悉後再逐漸加快速度，過程中膝蓋是「收」起而非「拖」"}, {"level": 0, "text": "加上跳躍：拉手→重心轉換出現感覺後即可起跳，同時完成甩拍動作"}, {"level": 0, "text": "左腿落地時膝蓋不可打直，須微彎以保持腰部張力和緩衝"}]}, {"heading": "全片總結：所有問題已回答，銜接下一階段", "start": "31:27", "end": "35:00", "lines": [{"level": 0, "text": "總結所有學員常問問題已在此系列中回答（發力、用腰、轉身、回位）"}, {"level": 0, "text": "提醒學員可能因尚未遇到對應階段的問題而暫時無法完全理解，日後遇到問題可回來重看"}, {"level": 0, "text": "完整動作總覽：揮拍（架拍→引拍→內旋→抓緊）+ 轉身（確認步→拉左手→帶動左腿→甩拍→抬右腿回位）"}, {"level": 0, "text": "銜接下一階段課程：高遠球、殺球、吊球"}]}]}, {"category": "殺球高遠球合集", "num": 8, "title": "8.7）原地殺球", "tags": [{"tag": "殺球核心發力機制：轉換重心＋腰部弓形", "reason": "全片核心，00:00–35:00 反覆講解「左肩下、右肩上」的轉身發力原理"}, {"tag": "最佳擊球點（下巴/上胸這個點）", "reason": "36:40–43:00 詳細解釋為何不是在腦門，而是下巴這邊發力最好"}, {"tag": "引拍要小、不可倒小臂", "reason": "20:00–34:00 大篇幅反駁「引拍要大才有力」的迷思，強調走上前＋手腕倒才是對的"}, {"tag": "手指放鬆抓緊與握拍細節", "reason": "05:00–08:00、24:00–30:00 食指推、拇指頂、其餘手指放鬆再抓緊"}, {"tag": "不可提前壓腰（仰著打／切球成因）", "reason": "43:00–48:00 說明太早壓腰會導致切球、殺球飄高"}, {"tag": "原地確認步與轉換重心動作分解", "reason": "00:53–20:00 一步步教定點殺球的完整動作"}, {"tag": "抬腿（右腿）與轉換重心幅度的關係", "reason": "17:50–21:00 抬腿越高、轉換重心空間越大"}, {"tag": "架拍高度（不宜過低）", "reason": "21:30–24:00 解釋架拍太低會導致引拍過大、擊球點太低"}, {"tag": "移動殺球與確認步銜接（片尾預告）", "reason": "56:00–58:30 簡短示範移動中如何用確認步接殺球，作為下一集鋪墊"}], "segments": [{"heading": "目錄與課程介紹", "start": "00:00", "end": "00:53", "lines": [{"level": 0, "text": "說明本集架構：先學定點殺球，再學移動殺球、單腿/雙腿起跳殺球、不轉身殺球、後退殺球等"}, {"level": 0, "text": "強調要先看過揮拍、轉身教學才能學殺球"}]}, {"heading": "定點殺球基本動作分解", "start": "00:53", "end": "06:50", "lines": [{"level": 0, "text": "找球：右腿先找球，比高遠球時右腿更往後一點以製造空間"}, {"level": 0, "text": "站位、壓重心、抬左手挺胸展肩"}, {"level": 0, "text": "下拍時左肩下沉、右肩上提，腰持續往前頂住（強調「不要提前壓腰」）"}, {"level": 0, "text": "手指放鬆抓緊機制"}, {"level": 1, "text": "食指往前推、拇指頂住球拍不掉"}, {"level": 1, "text": "推到擺直瞬間，所有手指抓緊，走朝外"}]}, {"heading": "慢動作連續示範（多角度）", "start": "06:50", "end": "20:00", "lines": [{"level": 0, "text": "從側面、正面、後面反覆示範同一組動作"}, {"level": 0, "text": "強調「引拍不能做得太滿」，連貫時每個動作只需做到一半即接下一個動作"}, {"level": 0, "text": "講解左肩右肩「上下弓」與轉身「左右弓」的配合"}]}, {"heading": "引拍大小與力量迷思", "start": "20:00", "end": "34:00", "lines": [{"level": 0, "text": "反駁「揮拍要拉很開才有力」的說法"}, {"level": 0, "text": "解釋高水準球員的「誇張引拍」其實是甩速快造成的視覺效果，實際引拍動作很短"}, {"level": 0, "text": "強調國際球員都是「走上前，手腕才往後倒」，不是先倒小臂"}]}, {"heading": "擊球點與空間感", "start": "34:00", "end": "46:30", "lines": [{"level": 0, "text": "講解為何許多人殺球會飄高、下網：因為在腦門後面擊球"}, {"level": 0, "text": "說明正確擊球點在下巴/上胸這一側身體位置，手臂重量最集中"}, {"level": 0, , "end": "07:18", "lines": [{"level": 0, "text": "建議用鏡子練習、儘量減少實戰對打"}, {"level": 0, "text": "職業選手應多練習分解動作直到習慣成自然，愛好者可適度實戰但需有意識地慢慢改"}, {"level": 0, "text": "練習優先順序：揮拍→轉身→帶步伐轉身→定量餵球訓練"}]}, {"heading": "Q3 手腕引拍方向（左右傾斜的可接受度）", "start": "07:18", "end": "11:48", "lines": [{"level": 0, "text": "拍面朝正最理想；朝外過多會導致引拍過大或過快，影響節奏"}, {"level": 0, "text": "建議保持自然放直，避免刻意扭轉造成的不穩定"}]}, {"heading": "Q4 腹部是否需要繃緊", "start": "10:52", "end": "11:48", "lines": [{"level": 0, "text": "澄清「壓腹發力」是誤解，真正發力來自臀、腿、腰的協調，非上半身單獨使用力"}]}, {"heading": "Q5 手肘伸直但不可鎖死", "start": "12:12", "end": "12:49", "lines": [{"level": 0, "text": "完全鎖直肘部易導致網球肘，應保持柔韌性稍留空間"}]}, {"heading": "Q6 握拍高低與發力關係", "start": "12:49", "end": "14:44", "lines": [{"level": 0, "text": "握低=拍子有效長度更長更重=更好發力；握太高則拍頭太輕，不建議"}]}, {"heading": "Q7 轉換重心時腰的動作方向（往前頂而非往上）", "start": "14:44", "end": "15:41", "lines": [{"level": 0, "text": "澄清「往上」的感覺其實來自肩膀抬高，腰本身是往前頂"}]}, {"heading": "Q8 正手偷襲球的殺球判斷（轉身不了時建議吊球）", "start": "15:41", "end": "16:32", "lines": [{"level": 0, "text": "若來不及轉身，建議放高球而非硬殺，以保持進攻節奏"}]}, {"heading": "Q9 練習後肌肉痠痛/疼痛的區分", "start": "16:32", "end": "18:27", "lines": [{"level": 0, "text": "痠痛可接受（未使用過的肌肉），若是「疼」則代表動作做得太誇張或憋太久"}]}, {"heading": "Q10 連貫動作不必做滿（延續之前主題）", "start": "18:27", "end": "20:04", "lines": [{"level": 0, "text": "再次強調每個動作環節熟練後可縮短，但順序邏輯不變"}]}, {"heading": "Q11 打框（框架）常見原因", "start": "20:04", "end": "22:30", "lines": [{"level": 0, "text": "離球太遠、確認步左腿跨距不足或過大、太早內旋轉拍"}]}, {"heading": "Q12 殺完球後身體後倒的原因", "start": "22:30", "end": "25:39", "lines": [{"level": 0, "text": "左腿跨距不夠過右腿/頭部、落地用腳跟而非腳尖（腳尖能吸收力量緩衝）"}]}, {"heading": "Q13-14 揮拍慢的原因與手指力量的決定性作用", "start": "25:46", "end": "28:52", "lines": [{"level": 0, "text": "下半身轉換速度、手指力量不足都會拖慢揮拍"}, {"level": 0, "text": "強調最後加速環節完全依賴手指爆發力"}]}, {"heading": "Q15 腰不能提前往前壓（詳解甩拍與腰部聯動時序）", "start": "28:52", "end": "31:53", "lines": [{"level": 0, "text": "用詳細示範說明左腳落地與甩拍必須同步，不可分開先後動作"}]}]}, {"category": "殺球高遠球合集", "num": 16, "title": "16  群問題解答", "tags": [{"tag": "殺球打到自己右腿的原因（右腿抬太多／轉腰不足）", "reason": "00:00–01:1 ": "球高時等球到位再做確認步；移動中則以「能否舒展打球」的高度點作判斷依據"}]}, {"heading": "Q30 後交叉步（被動步法）殺球", "start": "17:48", "end": "20:15", "lines": [{"level": 0, "text": "被動步法下用轉身瞬間的小動作完成上半身殺球姿勢，強調頂腰與展肩仍要做到"}]}, {"heading": "Q31-38 各種延伸問題快速解答", "start": "20:15", "end": "31:14", "lines": [{"level": 0, "text": "擺正拍面時機視球速快慢而定、練力量方法對成人小孩通用、轉身慢的補救方式、跳躍殺球需直著跳（不可用腳前轉）、甩拍後腰自然帶動而非刻意往前壓等"}]}, {"heading": "Q39 專業與非專業球員的本質差異（總結性重點）", "start": "31:14", "end": "34:00", "lines": [{"level": 0, "text": "用左右手比喻：非專業因手指無力需將動作做滿、專業因手指有力可將動作縮到極短"}, {"level": 0, "text": "動作縮短的隱蔽性好處：讓對手誤判來球意圖（誤以為要吊球結果突然殺球）"}, {"level": 0, "text": "全片總結：兩者差異幾乎全在「手指力量」"}]}]}, {"category": "網前教學", "num": 1, "title": "1.通告1", "tags": [{"tag": "課程整體介紹（六大網前技術總覽）", "reason": "00:00–01:59，說明課程包含擋網、戳球、反戳、勾球、挑球、推球、撲球六項技術，是整支影片核心內容"}, {"tag": "上架時間與購買方式公告", "reason": "03:39–07:29，反覆說明5月4日上架、單獨買vs打包買的差異"}, {"tag": "課程分拆說明（往前技術1、2）", "reason": "07:29–09:11，說明兩個包各含哪些技術"}, {"tag": "拍攝進度與延遲原因說明", "reason": "03:29–05:44，解釋為何拖到現在才上架、重拍十多次"}, {"tag": "各項技術常見錯誤預告", "reason": "03:39–07:29，逐項提到學員常犯錯誤，如戳球轉不起來、勾球控制不好、挑球傷肘等"}, {"tag": "價格與優惠提醒", "reason": "10:35–11:47，價格未定、前幾天有優惠"}, {"tag": "疫情問候（開場閒聊）", "reason": "00:00–01:59，與課程內容無關的開場白"}, {"tag": "呼籲按讚轉發訂閱", "reason": "11:47–12:29，結尾例行動作"}], "segments": [{"heading": "開場閒聴與問候", "start": "00:00", "end": "01:59", "lines": [{"level": 0, "text": "凌晨五點半錄影，自嘲喝了第八杯咖啡"}, {"level": 0, "text": "向上海疫情嚴重地區的朋友問候打氣"}, {"level": 0, "text": "提醒大家出門戴口罩注意安全"}]}, {"heading": "上架延遲道歉與新日期", "start": "01:59", "end": "03:39", "lines": [{"level": 0, "text": "原本承諾四月會上架，但因內容太多需要重拍"}, {"level": 0, "text": "宣布新上架日期改為5月4日晚上8點"}]}, {"heading": "課程規模與製作難度說明", "start": "03:39", "end": "05:44", "lines": [{"level": 0, "text": "網前技術包含六個技術，比之前單獨拍殺球、吊球花更多時間"}, {"level": 0, "text": "網前球更細膩，動作變化大，光是這系列重拍超過十次"}, {"level": 0, "text": "只要還有沒解決的疑問就會重新調整，導致前後銜接常需要重拍"}]}, {"heading": "六大技術逐一預告（核心段落）", "start": "05:44", "end": "09:11", "lines": [{"level": 0, "text": "第一項：正反手普通擋網"}, {"level": 1, "text": "糾正常見錯誤：手腕鎖死、豎拍去碰球"}, {"level": 1, "text": "強調不是搶 "05:49", "end": "06:04", "lines": []}, {"heading": "提醒：握拍基本功應該已經會了", "start": "06:04", "end": "06:33", "lines": [{"level": 0, "text": "若沒看過基本功網課，這邊快速複習"}, {"level": 0, "text": "正手三種握法：正常握法、李宗偉握法、陶菲克握法"}]}, {"heading": "三種握法的外觀比較", "start": "06:33", "end": "07:21", "lines": [{"level": 0, "text": "差異在於「拍頭朝向角度」不同，先粗略帶過"}]}, {"heading": "握拍方法一：正常握法（詳細教學）", "start": "07:21", "end": "09:03", "lines": [{"level": 0, "text": "球拍構造：8 個面（寬面 x2、斜稜 x4、側稜 x2）"}, {"level": 0, "text": "後三指位置："}, {"level": 1, "text": "小拇指靠在虎口下方肌肉線上"}, {"level": 1, "text": "中指沿著骨頭線，不放太裡面也不放太外面"}, {"level": 0, "text": "食指位置：骨頭處碰寬面"}, {"level": 0, "text": "拇指位置：碰另一邊寬面側邊"}, {"level": 0, "text": "握拍角度：沿手掌肌肉線微斜，不是完全平行"}]}, {"heading": "握拍方法二：理中尾握法", "start": "09:07", "end": "10:22", "lines": [{"level": 0, "text": "後三指位置跟正常握法相同"}, {"level": 0, "text": "差異：整體往內轉一點"}, {"level": 1, "text": "虎口位置移到「寬面與斜稜之間的線」上"}, {"level": 1, "text": "拇指抬高，跟食指差不多高度"}]}, {"heading": "握拍方法三：陶菲克握法", "start": "10:22", "end": "11:47", "lines": [{"level": 0, "text": "後三指位置相同，往反方向轉"}, {"level": 1, "text": "虎口位置在「寬面與斜稜之間的線」對到三指這一側"}, {"level": 0, "text": "拇指放下，食指維持握住"}]}, {"heading": "三種握法共同原則總結", "start": "11:47", "end": "11:56", "lines": [{"level": 0, "text": "不論哪種握法，拇指與其餘四指一定要分別貼在球拍不同面上"}, {"level": 0, "text": "常見錯誤：拇指與食指貼在同一面 → 沒有推擋功能，動作全部失效"}]}]}, {"category": "網前教學", "num": 4, "title": "4.正手(普通擋網)2手上細節動作", "tags": [{"tag": "正確擋網手腕翻轉動作（核心技術）", "reason": "00:36–09:00，全片核心，反覆示範\"往外翻\"而非\"豎拍上下碰\"的手腕動作"}, {"tag": "糾正常見錯誤動作（豎拍死板碰球）", "reason": "01:19–04:00＋13:20後段，大篇幅對比錯誤與正確動作的差異"}, {"tag": "三種握法（正常、李宗偉、陶菲克）比較教學", "reason": "00:00–00:36＋10:40–15:56，說明何時該切換握法"}, {"tag": "「搶高點」迷思破解", "reason": "01:40–05:07，反覆講解正確的高點位置不應過肩"}, {"tag": "手指放鬆與握拍力道控制", "reason": "09:42–14:07，強調小拇指、無名指要放鬆才能靈活推球"}, {"tag": "不同球位（高/中/低、內/外）對應手腕角度調整", "reason": "12:34–19:38，具體示範各位置的擊球手法"}, {"tag": "與其他往前技術（戳球、搓球）的動作區別提醒", "reason": "03:11–03:20，簡短提及避免動作混淆"}], "segments": [{"heading": "握法選擇建議", "start": "00:00", "end": "00:36", "lines": [{"level": 0, "text": "建議三種握法（正常、李宗偉、陶菲克）都要學"}, {"level": 0, "text": "平時用正常握法，但被動情況下換握法（如李宗偉握法）擋網/勾球會更穩"}]}, {"heading": "學習擋網技術的目的", "start": "00:36", "end": "01:19", "lines": [{"level": 0, "text": "目的一：被動情況下仍能穩定擋出有質量的球（貼網、可控方向）"}, {"level": 0, "text": "目的二：擋網動作是其他往前技術的基礎，先學對才能學好後續技術"}]}, {"heading": "常見錯誤動作剖析：豎拍死板碰球", "start": "01:19", "end": "05:07", "lines": [{"level": 0, "text": "很多教練教的「伸直手腕、豎拍上下碰」動作是錯的"}, {"level": 1, "text": "會導致動作僵硬、只能往上走、無法控制方向"}, {"level": 1, "text": "會過度用肩甚至小臂發力"}, {"level": 1, "text": "球一靠近身體就會來不及應變"}, {"level": 0, "text": "破解「搶高點」迷思"}, {"level": 1, "text": "正常最高點大約與肩同高，不需再往上抬"}, {"level": 1, "text": "抬太高只會讓身體更僵，逼得只能改做橫向搓球動作"}, {"level": 1, "text": "小孩子個子矮也不需要抬更高，太高時應改做戳球或勾球而非擋網"}]}, {"heading": "正確手腕動作示範（核心）", "start": "05:07", "end": "09:00", "lines": [{"level": 0, "text": "从正常握法開始說明：先扭手腕，再讓拍面往外翻約45度"}, {"level": 0, "text": "小臂會有輕微轉動配合，但主要靠手腕"}, {"level": 0, "text": "動作口訣：翻－碰－回來，連貫時像一個小幅度的「推」"}, {"level": 1, "text": "強調碰球後不停頓，順勢帶回"}, {"level": 0, "text": "手指放鬆是關鍵"}, {"level": 1, "text": "小拇指、無名指握太緊會鎖死手腕，變成整隻小臂在推球"}, {"level": 1, "text": "正確做法：後三指放鬆，讓手腕有空間往外翻，靠食指、拇指主導"}]}, {"heading": "不同握法的操作差異", "start": "09:00", "end": "12:34", "lines": [{"level": 0, "text": "李宗偉握法：直接往外翻手腕即可，拍面自然朝上，較容易掌握角度"}, {"level": 0, "text": "陶菲克握法：需要多轉一點才能讓拍面夠平，小臂轉動幅度更明顯"}]}, {"heading": "依球的位置（內/中/外）調整動作", "start": "12:34", "end": "19:38", "lines": [{"level": 0, "text": "球在外側：正手直接往外翻碰球"}, {"level": 0, "text": "球在中間偏內：手腕、小臂帶進來一些"}, {"level": 0, "text": "球在反手側（左側）：改用反拍處理，非本集重點"}, {"level": 0, "text": "強調高、中、低點動作原理相同，都靠手腕往外翻的空間"}]}, {"heading": "高點擋網的特殊處理", "start": "15:56", "end": "19:38", "lines": [{"level": 0, "text": "大部分擋網動作發生在腹部高度附近，直接往外翻即可"}, {"level": 0, "text": "若球較高（接近肩），才需要先把拍抬高到接近該高度，再做同樣的翻拍動作"}, {"level": 0, "text": "再更高則應改做撲球，而非勉強擋網"}]}]}, {"category": "網前教學", "num": 5, "title": "5.正手（普通擋網)3擊球點", "tags": [{"tag": "接近球的時機與拍子準備高度（核心）", "reason": "00:00–03:30，反覆講解拍子不要提早舉高，要讓球主動掉近拍面再碰球"}, {"tag": "常見錯誤：抬拍太早/太高導致來不及擊球", "reason": "00:00–02:00，示範抬手跟球同高會措手不及的情況"}, {"tag": "依球與身體距離調整手腕翻轉幅度（45度原則）", "reason": "03:30–05:49，具體示範遠/中/近三種距離對應的手腕角度"}, {"tag": "擊球點應在球拍甜點、身體中間位置", "reason": "02:56–03:30，簡短說明安全擊球位置"}, {"tag": "依球的高度（高/中/低/遠）調整整體動作幅度", "reason": "05:49–07:03，展示各種高度對應的動作大小"}, {"tag": "避免「早動拍」導致球偏向對角的錯誤", "reason": "02:00–02:56，說明過早移動拍面會讓球方向失控"}], "segments": [{"heading": "接近球的正確時機與準備高度", "start": "00:00", "end": "01:52", "lines": [{"level": 0, "text": "準備時球拍不需要抬到跟來球一樣高，除非要搶高點做戳球"}, {"level": 0, "text": "常見錯誤：拍子提早舉高追著球跑，導致球快落地時反而來不及擊球"}, {"level": 0, "text": "正確做法：拍子放低準備，讓球掉近拍面再出手，而非主動迎球太早"}]}, {"heading": "擊球時機與方向控制", "start": "02:00", "end": "03:30", "lines": [{"level": 0, "text": "不能太早移動球拍去等球，否則角度會偏向對角、失去控制"}, {"level": 0, "text": "應該讓球「靠近拍子才碰」，動作幅度依打遠/使勁與否調整"}, {"level": 0, "text": "擊球點建議落在球拍中間（甜點）附近，最安全、最好控制"}]}, {"heading": "依距離調整手腕翻轉角度（核心）", "start": "03:30", "end": "05:49", "lines": [{"level": 0, "text": "球離身體稍遠：手腕翻約45度即可，不需要更多"}, {"level": 0, "text": "球在中間：手腕帶進來一些，動作略有不同"}, {"level": 0, "text": "球離身體很近：要多往後拉一點手腕再出手"}, {"level": 0, "text": "球貼網很近：拍面接近打平，動作只需輕輕帶回，完全不發力"}]}, {"heading": "依高度調整動作總結", "start": "05:49", "end": "07:03", "lines": [{"level": 0, "text": "低點：最舒服，直接輕碰"}, {"level": 0, "text": "高點：手腕立起，拍面壓平再輕碰"}, {"level": 0, "text": "遠/近距離：遠則少翻一些，近則多拉一點手腕"}, {"level": 0, "text": "統一原則：動作幅度都很小、很放鬆，靠手腕微調而非大幅度揮拍"}]}]}, {"category": "網前教學", "num": 6, "title": "6.正手普通(擋網)4帶上步伐", "tags": [{"tag": "左手往後頂（肩胛骨）的重心控制原理（核心）", "reason": "00:53–05:00，全片核心，反覆強調左手是站穩、能回位的關鍵"}, {"tag": "步伐與手上動作的時間配合（腳落地與翻拍同步）", "reason": "06:11–08:24，具體講解何時翻拍才不會落後於球"}, {"tag": "左手用不對導致的常見問題（站不穩、跨不遠、回不了位）", "reason": "01:29–02:00＋07:38–08:24，列舉左手沒用好會造成的三種後果"}, {"tag": "步伐不多做深入解說，建議另看步法課程", "reason": "00:04–00:22，簡短帶過，非本集重點"}, {"tag": "依球遠近調整左手往後頂的幅度", "reason": "07:04–08:20，說明近球少頂、遠球多頂"}, {"tag": "啟動時機：不能太早也不能太晚", "reason": "08:02–08:24，簡短提醒啟動時間點"}], "segments": [{"heading": "開場說明與範圍界定", "start": "00:00", "end": "00:22", "lines": [{"level": 0, "text": "已講過手上動作與空間概念，本集聚焦步伐"}, {"level": 0, "text": "步伐本身不深入教學，假設學員已具備基礎步法知識，可另看步法網課"}]}, {"heading": "左手往後頂的核心原理（本集重點）", "start": "00:22", "end": "05:00", "lines": [{"level": 0, "text": "左手要往後頂到肩胛骨，而非隨意打開"}, {"level": 0, "text": "原因一：維持重心在左腿，才能站穩並保持能回位的能力"}, {"level": 1, "text": "若左手不用，重心會前移，導致："}, {"level": 2, "text": "打完球難以控制、身體變沉重"}, {"level": 2, "text": "難以回位，像整個人「踏下去」"}, {"level": 0, "text": "原因二：左手往後頂有助於後續發力（挑球時會再詳述），類似弓的蓄力感覺"}, {"level": 0, "text": "上半身姿勢：右側朝前、左側往後頂，身體呈斜線而非完全打直或完全側身"}, {"level": 0, "text": "不論並步或交叉步，跨腿瞬間左手都必須往後頂，否則重心跑掉、跨不遠"}]}, {"heading": "步伐與擊球動作的節奏配合", "start": "05:00", "end": "06:11", "lines": [{"level": 0, "text": "越被動（球越遠）左手往後頂的幅度越大"}, {"level": 0, "text": "腳落地要穩，靠左手的「反作用力」感覺完成"}]}, {"heading": "腳與手的同步時機（核心）", "start": "06:11", "end": "08:24", "lines": [{"level": 0, "text": "腳跟碰地的瞬間就要開始翻拍動作，而非等腳完全落地才擊球"}, {"level": 0, "text": "錯誤示範：碰到球才落地，會導致回位太慢、來不及應對對手回球"}, {"level": 0, "text": "正確節奏：擊球與退回幾乎同時完成，才能及時準備下一顆球"}, {"level": 0, "text": "左手往後拉的幅度：球離身體近則幅度小，球遠則需拉多一些以維持平衡"}, {"level": 0, "text": "啟動時機不能太早（會提早暴露、僵在原地）也不能太晚（來不及到位擊球）"}]}]}, {"category": "網前教學", "num": 7, "title": "7.正手(普通擋網)5被動球", "tags": [{"tag": "被動情況下改用李宗偉握法擋網（核心技巧）", "reason": "00:00–02:12，講解為何被動球要換握法才能讓拍面打平過網"}, {"tag": "正常握法在低點會導致拍面傾斜、易觸網的問題", "reason": "00:00–01:56，說明問題成因"}, {"tag": "李宗偉握法的手腕動作：食指帶動翻拍", "reason": "01:10–02:12，具體示範手指與手腕的操作方式"}, {"tag": "跨大步時左手往後頂的幅度需更大（被動情境延伸應用）", "reason": "02:19–03:45，延續前一集的左手頂步伐概念，套用到更被動更遠的情況"}, {"tag": "握拍需全程放鬆，避免因抓緊而動作僵硬", "reason": "03:55–04:28，強調小拇指、手腕放鬆的重要性"}, {"tag": "腳落地與手翻拍動作同步（複習前集重點）", "reason": "02:56–03:00，簡短複習"}], "segments": [{"heading": "被動低球的問題與握法切換（核心）", "start": "00:00", "end": "01:38", "lines": [{"level": 0, "text": "情境：球快要落地、人還沒跑到位、離球很遠"}, {"level": 0, "text": "正常握法在球低於膝蓋時，拍面會逐漸傾斜，越低越斜"}, {"level": 1, "text": "若貼網很近，斜拍面碰球容易直接觸網犯規"}, {"level": 0, "text": "解法：換成李宗偉握法，可以讓拍面在低點時仍保持打平"}, {"level": 1, "text": "拇指頂住拍柄一側，食指主導動作"}, {"level": 1, "text": "只需動手腕（食指第一節帶動），不需大幅動作即可讓球過網"}]}, {"heading": "握法切換的操作細節", "start": "01:38", "end": "02:19", "lines": [{"level": 0, "text": "正常握法在低點若想擺平拍面，手腕會被迫扭曲、變得彆扭，沒有推球空間"}, {"level": 0, "text": "李宗偉握法在同樣低點下，手腕保持放鬆，仍有空間可以「帶上來」完成推球"}, {"level": 0, "text": "此握法在練習被動勾球時也同樣適用"}]}, {"heading": "極端被動（大跨步）情境的手法與步伐配合", "start": "02:19", "end": "03:55", "lines": [{"level": 0, "text": "球很遠、很被動時需要跨大步（弓箭步／交叉步）"}, {"level": 0, "text": "左手要往後頂得比一般情況更多，才能撐住身體重心下探"}, {"level": 0, "text": "腳後跟碰地瞬間，同步做手腕翻拍動作"}, {"level": 0, "text": "依球遠近微調拍面角度：近身多翻、貼身少翻，但原理相同（往外翻、非朝內硬拗）"}]}, {"heading": "放鬆握拍的提醒（貫穿全集的原則）", "start": "03:55", "end": "04:28", "lines": [{"level": 0, "text": "整個持拍、下探、翻拍過程手指都要放鬆，不可用力抓緊"}, {"level": 0, "text": "抓太緊會讓手腕失去靈活性，變成整條手臂在推球，無法控球"}, {"level": 0, "text": "打完球後手指自然微收即可，不是刻意抓緊"}]}]}, {"category": "網前教學", "num": 8, "title": "8.正手(普通擋網)6示範", "tags": [{"tag": "不同球位（高/中/低/內/外/遠/近）連續實戰示範（核心，全片主體）", "reason": "00:00–04:00＋08:43–10:57，教練連續打不同來球位置示範正確擊球動作"}, {"tag": "腳步與手部翻拍的同步時機示範（腳跟落地即翻拍）", "reason": "04:52–07:40，具體示範\"腳一碰地就翻拍\"的節奏配合"}, {"tag": "對比錯誤動作（豎拍硬碰）與正確動作（往外翻）", "reason": "00:00–02:35，開場即用實際擊球對比錯誤/正確動作"}, {"tag": "握拍放鬆、避免小拇指抓緊的重要性（複習提醒）", "reason": "02:53–03:23，示範抓緊導致動作僵硬的後果"}, {"tag": "依球離網遠近切換握法（正常握法vs李宗偉握法）", "reason": "09:56–10:57，示範貼網近球改用李宗偉握法的實戰情境"}, {"tag": "搶最高點的正確高度示範（不超過肩高）", "reason": "02:35–02:55，示範最高擊球點大約與肩同高"}, {"tag": "擊球後動作方向澄清（帶回不等於往內收）", "reason": "05:41–06:04，簡短澄清視覺上容易誤解的動作方向"}], "segments": [{"heading": "開場對比示範：錯誤vs正確動作", "start": "00:00", "end": "02:35", "lines": [{"level": 0, "text": "示範「豎拍硬碰」的錯誤動作在不同球位（正面高球、外側球）下的僵硬表現"}, {"level": 0, "text": "對比正確的「往外翻」動作，分別示範低點（最舒服）、遠球（多拉）、中間位置"}]}, {"heading": "搶高點的正確幅度", "start": "02:35", "end": "02:55", "lines": [{"level": 0, "text": "示範最高擊球點大約與肩同高，不需要再往上抬"}]}, {"heading": "握拍放鬆的重要性（複習）", "start": "02:53", "end": "04:52", "lines": [{"level": 0, "text": "示範小拇指抓緊會導致動作僵硬、變成用小臂硬推，無法靈活控球"}, {"level": 0, "text": "對比放鬆手指、只用手腕帶回的正確做法"}]}, {"heading": "步伐與擊球節奏連續示範", "start": "04:52", "end": "08:43", "lines": [{"level": 0, "text": "澄清視覺誤解：帶拍動作是往前碰球再收回，不是往內收球"}, {"level": 0, "text": "錯誤示範：太早踏步、動作誇張、腳步與手部節奏脫節"}, {"level": 0, "text": "正確節奏：腳後跟碰地的瞬間同步做翻拍動作，碰到球後立刻能回位"}, {"level": 0, "text": "連續示範多顆不同高度、遠近的來球，驗證「腳碰地即翻拍」原則"}, {"level": 0, "text": "高點來球示範：手往外抬高，仍遵守同樣的腳手同步節奏"}]}, {"heading": "依球遠近與貼網程度调整動作（綜合示範）", "start": "08:43", "end": "10:57", "lines": [{"level": 0, "text": "遠球：手多往後拉"}, {"level": 0, "text": "貼網外側高球：往外翻拍角度加大"}, {"level": 0, "text": "貼網很近且低的球：改用李宗偉握法，将手直接放平，避免正常握法在低點斜拍導致觸網"}, {"level": 0, "text": "總結：越低、越貼網，李宗偉握法越好用；正常握法在腹部高度以上范围都足以應付"}]}]}, {"category": "網前教學", "num": 9, "title": "9.正手（普通擋網)7訓練計劃", "tags": [{"tag": "正手擋網基本動作", "reason": "架拍、往外翻手腕、放鬆手指，00:00–02:00，全片核心，反覆練習的基礎動作"}, {"tag": "步伐與時機配合", "reason": "腳跟落地與翻手腕同步，03:00–04:00、09:00–10:30，決定動作是否連貫的關鍵"}, {"tag": "不同高度球的應對", "reason": "高點、低點的手腕角度調整，00:20–01:50"}, {"tag": "握拍與手指放鬆", "reason": "三指放鬆、拇指食指控制力度，00:05–00:10、05:00–05:30"}, {"tag": "站位與距離感訓練", "reason": "前後左右預留一個腳步距離，04:00–05:00"}, {"tag": "被動球處理", "reason": "理中握法、更誇張握法應對低而被動的球，04:50–07:00"}, {"tag": "左手輔助與重心穩定", "reason": "左手往後頂以跨大步、蹲低，05:45–06:10"}, {"tag": "遠網與近網擋法差異", "reason": "力度、拍面角度不同，力度較大且不往上挑，12:00–13:18"}], "segments": [{"heading": "基礎架拍與手腕動作", "start": "00:00", "end": "02:00", "lines": [{"level": 0, "text": "握拍放鬆，虎口留有空間"}, {"level": 0, "text": "往外翻手腕、碰、回來的重複練習"}, {"level": 0, "text": "依球的高低（高點/低點）調整拍面朝外角度"}]}, {"heading": "手腕傾倒的正確角度", "start": "03:25", "end": "04:15", "lines": [{"level": 0, "text": "手腕不是垂直翻動，而是斜著往外翻"}, {"level": 0, "text": "常見錯誤：把手腕整個豎起來翻，是錯誤動作"}]}, {"heading": "站位與腳步距離", "start": "04:15", "end": "05:15", "lines": [{"level": 0, "text": "先用拋球練習，站定於固定距離"}, {"level": 0, "text": "前後、左右都要留出約一個腳步的距離，養成習慣"}]}, {"heading": "被動球與特殊握法", "start": "04:50", "end": "07:00", "lines": [{"level": 0, "text": "依球高度切換：肚子以上用正常握法，膝蓋以下用理中握法"}, {"level": 0, "text": "更誇張握法：拇指頂在框面上以增加控制"}, {"level": 0, "text": "食指骨頭往上推、拇指擋住控制力度"}]}, {"heading": "步伐與翻手腕的同步節奏", "start": "05:45", "end": "06:10、09:20–10:30", "lines": [{"level": 0, "text": "腳跟落地瞬間同步做翻手腕動作"}, {"level": 0, "text": "左手往後頂，幫助跨步與身體穩定"}, {"level": 0, "text": "強調越低的球左手越要用上，否則站不穩"}]}, {"heading": "連貫步伐練習（並步、走步）", "start": "10:30", "end": "11:40", "lines": [{"level": 0, "text": "從單一動作進展到「並步再走」的完整步伐"}, {"level": 0, "text": "練習抓準腳落地與翻拍時機"}]}, {"heading": "近網與遠網的擋法區別", "start": "12:00", "end": "13:18", "lines": [{"level": 0, "text": "近網：手腕輕碰、稍微朝上"}, {"level": 0, "text": "遠網：使勁推、拍面較平、身體稍往後站"}, {"level": 0, "text": "遠近皆用食指帶動、有翻拍動作"}]}]}, {"category": "網前教學", "num": 10, "title": "10.正手搓球（切搓球)1搓球必知", "tags": [{"tag": "戳球（搓球）技術的定義與目的", "reason": "切球使球轉，讓對手找不到球頭，00:00–01:00"}, {"tag": "切戳與斬戳的分類與原理", "reason": "往內切 vs 往外切，04:10–08:00，本集核心概念"}, {"tag": "如何順著球飛行方向戳球", "reason": "決定戳球成敗的關鍵原則，04:30–05:50"}, {"tag": "切戳的使用時機", "reason": "球離網遠近皆可用，通常在右肩/右胸前，06:00–07:00"}, {"tag": "斬戳的使用時機", "reason": "球近網、球在右邊、往外飛時使用，08:00–09:20"}, {"tag": "戳球得分的原理", "reason": "球轉導致對手挑高/出界，01:00–02:00"}, {"tag": "戳滾網球的進階目標", "reason": "提高難度、更難被回擊，02:10–02:30"}, {"tag": "龍捲風車球介紹", "reason": "球頭朝下轉動的極端案例，03:45–04:05"}], "segments": [{"heading": "戳球技術總覽與得分原理", "start": "00:00", "end": "02:10", "lines": [{"level": 0, "text": "戳球＝切球技術，使球旋轉讓對手看不到球頭"}, {"level": 0, "text": "球轉導致對手誤判：挑高、出界、或半場被動"}, {"level": 0, "text": "目標：戳出既轉又能轉得久（近地面仍在轉）的球"}]}, {"heading": "戳滾網球與龍捲風車球", "start": "02:10", "end": "04:05", "lines": [{"level": 0, "text": "滾網球：轉動球碰網帶落下，幾乎必得分"}, {"level": 0, "text": "龍捲風車球：球毛朝下轉，對手完全無法起球"}, {"level": 1, "text": "屬進階技術，後續章節會教"}]}, {"heading": "切戳與斬戳的定義", "start": "04:10", "end": "04:30", "lines": [{"level": 0, "text": "切戳：由外往內（右撇子從左往內）"}, {"level": 0, "text": "斬戳：由內往外（左往右，如同「舒展」）"}]}, {"heading": "順著球飛方向戳球的原則", "start": "04:30", "end": "05:50", "lines": [{"level": 0, "text": "核心原則：戳球方向必須順著來球方向，逆向會導致球亂飛或不轉"}, {"level": 1, "text": "球往內飛時做斬戳＝順向，容易轉"}, {"level": 1, "text": "球往內飛時做切戳＝逆向，容易變成硬打"}]}, {"heading": "切戳使用時機", "start": "06:00", "end": "07:50", "lines": [{"level": 0, "text": "適用：球離網遠或近皆可"}, {"level": 0, "text": "通常保持在右肩/右胸前"}, {"level": 0, "text": "球往外飛時做切戳較不順、國際球員少用"}]}, {"heading": "斬戳使用時機", "start": "08:00", "end": "09:20", "lines": [{"level": 0, "text": "適用：球必須離網近；球在右邊或直飛時"}, {"level": 0, "text": "球往內飛時做斬戳做不到（逆向）"}, {"level": 0, "text": "常用情境：對手勾球，球往外飛時做斬戳，特別容易轉"}]}]}, {"category": "網前教學", "num": 11, "title": "11.正手搓球（切搓球）2手上細節動作(上)", "tags": [{"tag": "接近球（先舒展再推手腕）的核心分解動作", "reason": "全片最重要觀念，09:00–14:00反覆強調，錯誤示範多次對比"}, {"tag": "手腕保持往後倒、避免推直", "reason": "推完手腕不可伸直，否則球不過網或亂飄，16:00–19:00"}, {"tag": "架拍準備動作與握拍放鬆", "reason": "手肘微曲、虎口留空間，05:00–06:20"}, {"tag": "小臂隨推手腕自然轉動", "reason": "形成「包住球」的動作感覺，17:30–21:00"}, {"tag": "舒展方向：往前左方 vs 純往左", "reason": "依球的位置調整路徑，10:50–13:30"}, {"tag": "戳球的教學順序規劃", "reason": "先學普通搓、再轉、再久轉、最後龍捲風，00:00–01:10"}, {"tag": "分解動作與連貫動作的差異", "reason": "初學需誇張分解，熟練後動作變小，02:50–03:20"}, {"tag": "戳球時機：貼近球頭瞬間摩擦", "reason": "太早/太晚都會失誤，26:00–28:00"}, {"tag": "握拍三指放鬆、拇指食指控制", "reason": "20:40–21:00"}], "segments": [{"heading": "教學規劃與整體概念說明", "start": "00:00", "end": "01:10", "lines": [{"level": 0, "text": "學習順序：先普通搓球→戳轉→轉得久→龍捲風球"}, {"level": 0, "text": "因人而異的握法（正常/李宗偉/陶菲克握法皆可用）"}]}, {"heading": "架拍準備姿勢", "start": "01:10", "end": "06:20", "lines": [{"level": 0, "text": "手肘微曲、非伸直，架拍在右肩前"}, {"level": 0, "text": "拍面約45度朝上（貼網時可放平）"}, {"level": 0, "text": "握拍要放鬆、留空間，才能讓手腕自然往後倒"}]}, {"heading": "常見錯誤：直接動手腕", "start": "06:20", "end": "09:00", "lines": [{"level": 0, "text": "錯誤示範：抬牌接近球後直接動手腕＝戳不出來、易受傷"}, {"level": 0, "text": "正確流程：先產生速度、舒展接近球，再做手腕動作"}]}, {"heading": "接近球的分解動作", "start": "09:00", "end": "14:00", "lines": [{"level": 0, "text": "「接近球」是最多人漏掉的細節，如同後場動作先接近再打"}, {"level": 0, "text": "舒展方向：一般往前左方；若球很靠近身體則直接往左"}, {"level": 0, "text": "手要進到球的裡面、拍頭則在球旁邊"}]}, {"heading": "推手腕與拍面變化", "start": "14:00", "end": "20:00", "lines": [{"level": 0, "text": "推完手腕手不可伸直，否則拍面超後、球不過網或往後飛"}, {"level": 0, "text": "手腕保持有點斜、有點朝外，戳完後仍維持不完全打直"}, {"level": 0, "text": "小臂隨轉動，拍面會自然從斜漸漸擺平"}]}, {"heading": "握拍放鬆與力度控制", "start": "20:40", "end": "21:00", "lines": [{"level": 0, "text": "拇指食指帶動拍面控制方向與力度"}, {"level": 0, "text": "後三指僅輕握，不施力"}]}, {"heading": "分解動作練習與速度控制", "start": "21:40", "end": "28:00", "lines": [{"level": 0, "text": "初學動作可放大，熟練後逐漸縮小、加速"}, {"level": 0, "text": "戳球時機：拍與球接近、瞬間摩擦，太早或太晚都失誤"}, {"level": 0, "text": "練習距離可從稍遠開始，逐漸貼近球頭以求更薄的摩擦"}]}]}, {"category": "網前教學", "num": 12, "title": "12.正手搓球（切磋球)3細節動作(下)", "tags": [{"tag": "架拍時球要在拍的「裡面」", "reason": "決定摩擦面積與轉度的關鍵位置概念，00:55–03:20"}, {"tag": "依球的左右位置調整拉近幅度", "reason": "球在左/中/右時不同的準備動作，03:20–10:00，篇幅最大"}, {"tag": "手腕保持往後倒、推手腕的正確時機", "reason": "重申上集重點，03:50–06:00"}, {"tag": "順著球飛方向的重要性再強調", "reason": "球從外往內飛時最容易轉，10:00–11:00"}, {"tag": "分解動作到連貫動作的過渡", "reason": "讓學生理解「看似同時」實為先後動作，11:20–14:20"}, {"tag": "戳球擊球點不必是甜點", "reason": "中間偏上範圍皆可，因為是切球非發力，14:20–15:10"}, {"tag": "不可突然抓緊拍柄", "reason": "14:50、15:10 提醒避免球飄"}], "segments": [{"heading": "架拍時球與拍的相對位置", "start": "00:00", "end": "03:20", "lines": [{"level": 0, "text": "準備時手稍抬高至肩部"}, {"level": 0, "text": "架拍時球應落在拍子「裡面」（不同於擋網時球在外面）"}, {"level": 0, "text": "到球底下太深會導致摩擦面積不足、易打槓"}]}, {"heading": "依球左右位置調整拉近方式", "start": "03:20", "end": "10:00", "lines": [{"level": 0, "text": "球偏右：往前、往左拉一點點即可"}, {"level": 0, "text": "球在中間（胸口）：整個小臂大幅往左拉，像「往左邊砍菜」"}, {"level": 0, "text": "強調不要一開始就死板固定往前左方，需視球的位置調整"}, {"level": 0, "text": "手腕全程保持往後倒，直到準備推的瞬間"}]}, {"heading": "推手腕的時機與拍面變化", "start": "03:50", "end": "08:00", "lines": [{"level": 0, "text": "保持往後倒 + 小臂同步轉 = 拍面自然由斜變平"}, {"level": 0, "text": "太早動手腕：打不到球或提前僵住"}, {"level": 0, "text": "太晚動手腕：容易打槓、傷手腕"}]}, {"heading": "戳球方向與球飛方向的關係", "start": "10:00", "end": "11:00", "lines": [{"level": 0, "text": "球從外往內飛、球頭朝內時最容易順勢戳轉"}, {"level": 0, "text": "若逆著球的方向戳，容易變成「打」而非「戳」"}]}, {"heading": "分解動作與連貫動作的差異解說", "start": "11:20", "end": "14:20", "lines": [{"level": 0, "text": "初學者需要明顯的「一、二、三、四」分解節奏"}, {"level": 0, "text": "熟練後動作連貫，看似「抬拍即動手腕」，實為舒展與推手腕幾乎同時發生"}, {"level": 0, "text": "國際球員的看似簡單動作，其實建立在扎實分解動作之上"}]}, {"heading": "戳球擊球點與注意事項", "start": "14:20", "end": "15:10", "lines": [{"level": 0, "text": "擊球點不需在最尖端「甜點」，中間偏上範圍皆可（非發力動作，只是切球）"}, {"level": 0, "text": "避免突然抓緊拍柄，否則球會飄或彈起"}]}]}, {"category": "網前教學", "num": 13, "title": "13.正手搓球（切磋球)4示範", "tags": [{"tag": "接近球再推手腕的完整示範", "reason": "分解動作到連貫動作的實際演練，00:00–02:00"}, {"tag": "依球落點（右肩/胸口）調整舒展方向", "reason": "往前 vs 往左，01:15–02:00"}, {"tag": "推手腕過早/過晚的錯誤示範對比", "reason": "2:10–3:30，多次重複錯誤動作讓學生看清問題"}, {"tag": "戳完後手腕不可推直", "reason": "避免球不過網，02:35–03:00"}, {"tag": "貼網球需擺平拍面、順著球方向切", "reason": "球往外飛時稍微往外切，01:40–02:00"}, {"tag": "速度感與連貫節奏", "reason": "球速較快，不能太慢分解，00:50–01:10"}, {"tag": "手指放鬆、避免抓緊", "reason": "03:20–03:35"}], "segments": [{"heading": "基本示範：由外往內拋球練習", "start": "00:00", "end": "01:15", "lines": [{"level": 0, "text": "教練站定不動，讓助理從外往內拋球至右肩或胸前"}, {"level": 0, "text": "分解演示：先接近球（不推手腕）→再推手腕戳球"}, {"level": 0, "text": "強調連貫後動作會變得像「一抬拍就動手腕」"}]}, {"heading": "依球落點調整站位與方向", "start": "01:15", "end": "02:00", "lines": [{"level": 0, "text": "球在右手邊：只需往前舒展一點"}, {"level": 0, "text": "球到胸口：改為往左邊移動再戳，且擺平拍面"}, {"level": 0, "text": "貼網來球：手腕多倒一點、稍微往外切"}]}, {"heading": "推手腕時機錯誤示範", "start": "02:10", "end": "03:35", "lines": [{"level": 0, "text": "錯誤1：推手腕太早推直＝手臂僵直，球不過網或往後飛"}, {"level": 0, "text": "錯誤2：過球太多才推手腕＝打不到球或直接打"}, {"level": 0, "text": "正確：球到達適當高度時才接近並瞬間推"}]}, {"heading": "收尾提醒", "start": "03:35", "end": "04:05", "lines": [{"level": 0, "text": "手腕保持往後倒姿勢進行推動不會受傷"}, {"level": 0, "text": "不要突然抓緊，需保持速度感完成動作"}]}]}, {"category": "網前教學", "num": 14, "title": "14.正手搓球（切磋球)5最佳擊球點", "tags": [{"tag": "戳球的最佳高度：胸口以上", "reason": "全片核心概念，00:00–04:30，反覆用示範對比說明"}, {"tag": "單打vs雙打對戳球高度的不同要求", "reason": "單打可稍高、雙打需壓低，00:50–01:40"}, {"tag": "重心壓低以應對低球", "reason": "不離開重心硬伸手，而是蹲低身體，04:30–07:10"}, {"tag": "依遠近網調整拍面角度（斜 vs 平）", "reason": "決定球落點遠近的關鍵技巧，08:35–10:15"}, {"tag": "看球頭方向決定何時擊球", "reason": "球頭朝下瞬間才擊球，10:15–12:05"}, {"tag": "眼睛與拍同高度以提高穩定度", "reason": "07:20–08:10"}, {"tag": "手腕動作幅度小、非發力動作", "reason": "08:20–08:35"}, {"tag": "站前 vs 從後場跑上前的姿勢差異", "reason": "12:05–13:30，動作連貫性說明"}], "segments": [{"heading": "戳球的最佳高度原則", "start": "00:00", "end": "04:30", "lines": [{"level": 0, "text": "「越高越好」有一定道理，但不可能每球都搶到網帶高度"}, {"level": 0, "text": "高點定義：胸口以上"}, {"level": 1, "text": "單打：可稍高、只要貼網轉度足夠仍可得分"}, {"level": 1, "text": "雙打：需往下戳，避免被前排選手撲球"}, {"level": 0, "text": "胸口/眼睛高度是最容易控制與發力的角度"}, {"level": 1, "text": "太直（伸太遠）難以控制，容易打進網"}]}, {"heading": "重心壓低應對低球", "start": "04:30", "end": "07:10", "lines": [{"level": 0, "text": "低球不代表手要伸得離重心很遠，而是壓低身體重心（左腿彎曲）"}, {"level": 0, "text": "壓得越低，仍能維持同樣的戳球動作與穩定度"}, {"level": 0, "text": "站前排等球 vs 從後場跑上前，壓重心幅度需求不同"}]}, {"heading": "眼睛高度與拍面同步", "start": "07:20", "end": "08:10", "lines": [{"level": 0, "text": "戳球瞬間眼睛盡量壓低到接近拍的高度，有助瞄準與穩定"}]}, {"heading": "手腕動作幅度與力度提醒", "start": "08:20", "end": "08:35", "lines": [{"level": 0, "text": "戳球動作幅度小、快速，非發力動作，勿刻意加大動作"}]}, {"heading": "遠網與貼網的拍面角度調整", "start": "08:35", "end": "10:15", "lines": [{"level": 0, "text": "遠網：不擺平，拍面稍斜，讓球往前轉且勉強過網"}, {"level": 0, "text": "貼網：拍面擺平，避免球飛太遠"}, {"level": 0, "text": "示範對比：擺平＝貼網停留；不擺平＝飛遠"}]}, {"heading": "依球頭方向決定擊球時機", "start": "10:15", "end": "12:05", "lines": [{"level": 0, "text": "核心原則：一定要在球頭朝下瞬間擊球，否則球會下網或往後飛"}, {"level": 0, "text": "若球頭方向與擊球方向相反，需調整拍面朝下角度以順應球頭"}, {"level": 0, "text": "此原則與遠近網角度調整是同一原理的不同切入角度"}]}, {"heading": "站姿差異：站前等球 vs 後場跑上前", "start": "12:05", "end": "13:30", "lines": [{"level": 0, "text": "站前排等球：可提早瞄準，只需小幅度動作即可戳球"}, {"level": 0, "text": "從後場跑上前：需要更大幅度的接近球動作（先拉近手臂再戳），連貫性要求更高"}]}]}, {"category": "網前教學", "num": 15, "title": "15.正手搓球（切磋球)6步伐+調整位置", "tags": [{"tag": "腳步節奏與擊球時機同步（同正手擋網）", "reason": "00:00–01:00，落地瞬間戳球"}, {"tag": "依球左右位置調整站位以確保順向戳球", "reason": "球在右邊時盡量跑到球正前方，01:05–03:10，全片核心"}, {"tag": "壓低重心的正確方法：彎左腿而非彎右腿/屁股後坐", "reason": "03:10–05:20"}, {"tag": "左手往後頂的重要性（穩定重心與跨步幅度）", "reason": "04:20–05:00"}, {"tag": "球在中間時的步伐與戳球示範", "reason": "06:10–08:15"}, {"tag": "球在右邊時往外跑、把球放在身前的技巧", "reason": "08:15–10:10"}, {"tag": "球在外側時改用斬戳更合理", "reason": "10:10–11:00"}, {"tag": "罕用招式：球飛向邊線時的逆境切法", "reason": "11:00–13:20，教練特別說明「幾乎沒人用」"}], "segments": [{"heading": "步伐節奏與正手擋網的共通性", "start": "00:00", "end": "01:00", "lines": [{"level": 0, "text": "腳跟落地瞬間完成戳球動作，與普通擋網節奏相同"}, {"level": 0, "text": "左手往後頂、腳踏地同步向前舒展"}]}, {"heading": "依球位置調整站位以順向戳球", "start": "01:05", "end": "03:10", "lines": [{"level": 0, "text": "若球直著飛過來，直接原地戳較難做"}, {"level": 0, "text": "更穩妥做法：往正前方跑動，讓球正好落在右肩前，形成順向戳球"}, {"level": 0, "text": "引用國際球員（如李梓嘉、阿薩隆）示範，多在正前方戳球以確保轉度"}]}, {"heading": "壓低重心的正確方式", "start": "03:10", "end": "06:00", "lines": [{"level": 0, "text": "錯誤：彎右腿或屁股後坐"}, {"level": 0, "text": "正確：彎左腿（後腳），跨步時左手往後頂以撐住身體"}, {"level": 1, "text": "左手頂得越多，能壓得越低，越能應對更低的球"}, {"level": 1, "text": "沒有頂住則無法穩定壓低重心"}]}, {"heading": "動作幅度與連貫性再提醒", "start": "05:20", "end": "06:10", "lines": [{"level": 0, "text": "手不需伸得完全直，保持自然微曲"}, {"level": 0, "text": "對比多位國際球員（陶田、李子嘉、阿賽隆）皆採此方式壓低戳球"}]}, {"heading": "球在中間位置的示範", "start": "06:10", "end": "08:15", "lines": [{"level": 0, "text": "從中間啟動，整手臂拉近、壓低重心後擺平拍面"}, {"level": 0, "text": "動作幅度不大，重點在跑動速度與接近球的精準度"}]}, {"heading": "球在右邊時的處理方式", "start": "08:15", "end": "10:10", "lines": [{"level": 0, "text": "建議往外跑一步，把球「放在身前」而非放在右側"}, {"level": 0, "text": "若直接在右側戳，較難做（來不及加速）；把球移到正前方效果更好"}, {"level": 0, "text": "若球稍遠則拍面保持稍斜，不完全擺平"}]}, {"heading": "球偏外側時改用斬戳的合理性", "start": "10:10", "end": "11:00", "lines": [{"level": 0, "text": "若球太靠外側，為切磋而額外多跑不划算，直接用斬戳更符合實戰效率"}]}, {"heading": "罕見招式：球飛向邊線的切磋處理", "start": "11:00", "end": "13:20", "lines": [{"level": 0, "text": "教練說明此招式「幾乎沒有國際球員使用」，但示範其可行性"}, {"level": 0, "text": "做法：手腕往後多倒一點，順著球飛方向往外切，而非純往前"}]}]}, {"category": "網前教學", "num": 16, "title": "16.正手搓球(切磋球)7訓練計劃", "tags": [{"tag": "手腕推切動作", "reason": "00:00–02:00 反覆練「抬上來→戳」，強調不要只用手腕、要小臂帶手腕同時動"}, {"tag": "步伐與擊球時機配合", "reason": "05:49 起強調「腳跟落地」與「戳球」要同時，重心前壓時發力最佳"}, {"tag": "分解教學：先定點後帶步伐", "reason": "00:00–05:49 先原地只動手腕，OK 後才加大動作、湊速度"}, {"tag": "併步／跨步練習", "reason": "09:20–12:37 教併步、跨步到位再戳，含往外跑取位"}, {"tag": "放鬆手指、勿抓緊", "reason": "多次提醒，例如 01:30、05:16、08:20"}, {"tag": "小臂翻轉帶動球拍摩擦球", "reason": "05:58–07:00 講解轉小臂、摩擦球產生轉度"}, {"tag": "擊球點在身體前方、保持距離感", "reason": "04:08–04:37 強調人球前後有距離、放眼前擊球"}, {"tag": "球托朝下的旋轉效果", "reason": "12:50 結尾展示戳出的球都會轉、轉得久"}], "segments": [{"heading": "手上動作與手腕基礎練習", "start": "00:00", "end": "05:49", "lines": [{"level": 0, "text": "手腕角度與翻轉"}, {"level": 1, "text": "倒手腕時稍微呈 45 度，不要放平"}, {"level": 1, "text": "推手腕動作要與小臂同時，不能只用手腕"}, {"level": 0, "text": "原地不移動，先練「抬上來、戳」的節奏"}, {"level": 1, "text": "保持手腕後倒姿勢，推完仍要維持"}, {"level": 1, "text": "手指放鬆，不要抓緊，否則拍面擺不平"}, {"level": 0, "text": "人與球的距離"}, {"level": 1, "text": "前後、上下都要保持一點距離，不能貼身硬打"}, {"level": 1, "text": "建議球拋到右肩前方，方便擊球"}]}, {"heading": "加大動作、銜接速度階段", "start": "05:49", "end": "08:15", "lines": [{"level": 0, "text": "從大動作開始學（球拋遠一點），逐漸拉近手臂再轉小臂"}, {"level": 0, "text": "轉小臂時機"}, {"level": 1, "text": "快要碰到球才轉，不能太早發力"}, {"level": 1, "text": "保持放鬆，避免突然抓緊拍柄"}, {"level": 0, "text": "目標：做到「短而快」的摩擦動作"}]}, {"heading": "步伐配合：跨步戳球", "start": "08:15", "end": "09:20", "lines": [{"level": 0, "text": "跨步時機"}, {"level": 1, "text": "邁步、腳跟落地與戳球動作要同時"}, {"level": 1, "text": "身體重心前壓的瞬間力量最大"}, {"level": 0, "text": "練習流程：一步一步慢慢加入步伐"}]}, {"heading": "併步練習與方向控制", "start": "09:20", "end": "12:37", "lines": [{"level": 0, "text": "併步接近球"}, {"level": 1, "text": "站中間先練單邁步，之後加練併步（往外移動取位）"}, {"level": 1, "text": "併步後球應落在右肩前方，不要跑過頭或站太外側"}, {"level": 0, "text": "拍面角度與方向"}, {"level": 1, "text": "拍頭朝前方戳球容易失誤，建議保持斜向、朝右肩前"}, {"level": 1, "text": "往外併步時身體要跟著往該方向壓"}]}, {"heading": "收尾展示與效果", "start": "12:37", "end": "12:58", "lines": [{"level": 0, "text": "教練示範連續戳球，強調球托朝下、旋轉持久的效果"}]}]}, {"category": "網前教學", "num": 17, "title": "17.正手搓球（切磋球)8國際球員「不同搓法」", "tags": [{"tag": "國際球員動作縮小化原理", "reason": "00:35–02:53 解釋李宗偉、陶菲克等握法不同但原理相同，只是把動作做小"}, {"tag": "隱蔽性與旋轉效果的取捨", "reason": "02:13–02:37 說明動作縮小的兩個原因：隱蔽性、球更轉"}, {"tag": "小臂與手腕同動關係", "reason": "01:15–01:55 說明看似只動手腕，實際手臂也在動"}, {"tag": "貼近球瞬間加速", "reason": "06:24 起強調不能太早發力，要貼球才瞬間戳"}, {"tag": "各種握法皆通用", "reason": "00:00–00:07 開場說明握法不影響動作原理"}, {"tag": "手腕仍需往後倒、不可繃直的共同要點", "reason": "04:47–06:04 反覆示範伸直/繃直的錯誤"}, {"tag": "由大動作逐漸縮短、加快、加準", "reason": "02:07–02:10、05:57 練習方法：先大後小"}], "segments": [{"heading": "開場：握法不影響戳球原理", "start": "00:00", "end": "00:35", "lines": [{"level": 0, "text": "各種握法（李宗偉、陶菲克、雙打握法）都適用同一動作原理"}]}, {"heading": "國際球員動作縮小化解析", "start": "00:35", "end": "02:07", "lines": [{"level": 0, "text": "從正面看似乎只是「豎著」動作，但從側面看其實有「倒下去」的完整動作"}, {"level": 0, "text": "大動作原理不變，只是把動作幅度做小、做精準"}, {"level": 0, "text": "小臂與手腕是同時動的，只是外觀上動作幅度小，容易被誤認為「只動手腕」"}]}, {"heading": "動作縮小化的原因", "start": "02:07", "end": "02:37", "lines": [{"level": 0, "text": "原因一：隱蔽性——小動作突然戳球，對手難預判"}, {"level": 0, "text": "原因二：動作小、快、準時球更容易轉（如龍捲風式戳球）"}]}, {"heading": "技術要求：不可做太大或太直", "start": "02:37", "end": "04:47", "lines": [{"level": 0, "text": "大動作是為了湊速度，之後再轉小臂戳球"}, {"level": 0, "text": "不可能拍頭朝前直接硬戳，一定要「拉進、再轉」"}, {"level": 0, "text": "很多人以為球員手臂繃得很直，其實仍保留一定的收/倒動作"}]}, {"heading": "由大到小的練習邏輯", "start": "04:47", "end": "06:24", "lines": [{"level": 0, "text": "教練親自對比示範「教學用大動作」vs「球員用小動作」，強調本質相同"}, {"level": 0, "text": "熟練後逐漸把動作縮短、加快、加準"}, {"level": 0, "text": "手腕仍要往後倒，否則球過不了網"}]}, {"heading": "貼球瞬間加速的節奏要求", "start": "06:24", "end": "06:42", "lines": [{"level": 0, "text": "不能太早發力（會打不到球或變成打而非搓）"}, {"level": 0, "text": "要等球接近拍面時瞬間摩擦戳球"}]}]}, {"category": "網前教學", "num": 18, "title": "18.正手搓球（展搓)1", "tags": [{"tag": "展搓（斬戳）與切搓（切磋）的核心差異", "reason": "00:04–02:20 手上動作少、靠腳下移動產生速度"}, {"tag": "展搓動作分解教學", "reason": "04:15–10:00 收回再往外展開、轉小臂的完整動作流程"}, {"tag": "拍面角度隨收臂幅度變化", "reason": "12:07–13:11 收多寡決定拍頭朝前或朝外，需依球的位置調整"}, {"tag": "常見錯誤示範", "reason": "00:36–01:20 展示戳得高又不轉的錯誤球"}, {"tag": "手指放鬆、不可突然抓緊", "reason": "07:53、09:46 反覆強調"}, {"tag": "展搓應用場景：球飛向外側時使用", "reason": "00:04–00:24 開場定義使用時機"}, {"tag": "步伐介入與逐漸縮小動作", "reason": "14:14–15:11 移動中動作會自然變小，靠腿部工作為主"}, {"tag": "勿在慢動作階段提早發力", "reason": "09:04、13:12 提醒不要用蠻力導致球飄"}], "segments": [{"heading": "引入：展搓（斬戳）適用情境與常見錯誤", "start": "00:00", "end": "01:25", "lines": [{"level": 0, "text": "適用時機：球飛向外側、靠外時使用展搓"}, {"level": 0, "text": "教練示範常見錯誤：戳得高但不轉，導致很多人不敢用展搓技術"}]}, {"heading": "展搓 vs 切搓的原理差異", "start": "01:25", "end": "04:15", "lines": [{"level": 0, "text": "共同點：都需要對的速度、對上球飛方向、掌握空間與節奏"}, {"level": 0, "text": "差異：切搓靠手上動作多、可以站定不動；展搓手上動作少，需要靠腳下移動產生速度"}, {"level": 0, "text": "展搓的手臂伸展空間有限（伸到底就沒速度了），因此依賴腿部移動延續速度"}]}, {"heading": "展搓手上動作教學（收－轉－展）", "start": "04:15", "end": "08:15", "lines": [{"level": 0, "text": "準備動作：往外繞、轉小臂、收回到右肩前方，手腕仍保持後倒"}, {"level": 0, "text": "手臂不能一開始就伸 不動，直到腳要落地那一刻才開始舒展"}]}, {"heading": "擊球點位置：右肩前方最穩", "start": "02:40", "end": "04:22", "lines": [{"level": 0, "text": "斬戳/切戳最理想擊球點在右肩前方"}, {"level": 0, "text": "球越靠外，若能跑到位，舒展空間越大、轉度越好"}, {"level": 0, "text": "跑不到位也能勉強完成，但效果不如跑到位"}]}, {"heading": "落地與舒展同步的節奏訓練", "start": "04:22", "end": "07:00", "lines": [{"level": 0, "text": "反覆練習「一、二、踏」節奏：邁步接近球，腳落地瞬間舒展摩擦"}, {"level": 0, "text": "錯誤示範：邊移動邊舒展，導致舒展完才碰球，變成「打」"}, {"level": 0, "text": "目標感受：身體重心下壓與手部加速同時發生，力量最集中"}]}, {"heading": "跨步與併步的實際應用", "start": "07:00", "end": "08:37", "lines": [{"level": 0, "text": "往外跑取位，將球盡量安排在右肩前"}, {"level": 0, "text": "一定要先舒展再落地，不可先拆（提早舒展）"}]}, {"heading": "簡化大動作為實戰小動作", "start": "08:37", "end": "10:01", "lines": [{"level": 0, "text": "大動作是學習階段的必要過程（類似用非慣用手學習新動作）"}, {"level": 0, "text": "熟練後動作應簡化，最終目標接近球時只需小幅摩擦"}]}, {"heading": "蹬地技巧：右腿抬高延伸蹬地距離", "start": "10:01", "end": "11:20", "lines": [{"level": 0, "text": "右腿抬得越高，能蹬得越遠，維持速度時間越久"}, {"level": 0, "text": "身體會隨之微微後仰，這是正常現象（低點挑球也會出現）"}]}, {"heading": "摩擦時機與手感訓練", "start": "11:20", "end": "13:44", "lines": [{"level": 0, "text": "太早或太晚發力都會變成「打」而非搓球"}, {"level": 0, "text": "練習重點：儘量減少手部動作，靠腿部提供主要速度"}, {"level": 0, "text": "逐步從大動作過渡到熟練後的小動作，時間點抓準即可"}]}]}, {"category": "網前教學", "num": 22, "title": "22.正手搓球（展搓)最佳高度和擊球點", "tags": [{"tag": "最佳擊球高度：胸口到嘴巴之間", "reason": "00:00–00:52 核心結論"}, {"tag": "展搓僅適用於貼網球，無法打遠", "reason": "00:52–02:15 解釋轉與遠不可兼得的原理"}, {"tag": "擊球點太高（眼睛處）會很彆扭", "reason": "00:16–00:52 示範說明原因"}, {"tag": "右腿往外多蹬一點可增加旋轉效果", "reason": "04:16–05:00 額外技巧"}, {"tag": "反戳技術留待後續課程教學", "reason": "02:15–02:38 提及但不展開"}, {"tag": "李宗偉對角球案例：貼網斬戳致命性", "reason": "01:36–01:49 舉例說明實戰效果"}, {"tag": "靠外球仍可完成，但需放鬆手指、避免抓緊", "reason": "05:01–05:32"}], "segments": [{"heading": "最佳擊球高度定義與原因", "start": "00:00", "end": "00:52", "lines": [{"level": 0, "text": "最佳高度：胸口到嘴巴之間"}, {"level": 0, "text": "抬到眼睛太高：手腕需額外往下折，動作彆扭，實戰中沒人這樣打"}, {"level": 0, "text": "對比切磋：切磋有往內帶速度的空間，較能適應較高球；展搓較難"}]}, {"heading": "展搓的物理限制：轉與遠不可兼得", "start": "00:52", "end": "02:15", "lines": [{"level": 0, "text": "展搓動作幅度小，手臂伸展空間有限，伸到底就沒速度"}, {"level": 0, "text": "只能在貼網球使用：要嘛球會轉但去不遠，要嘛能過網但不轉"}, {"level": 0, "text": "案例：李宗偉挑球後對手用靈彈（貼網展搓）直接得分"}]}, {"heading": "反戳技術留待後續說明", "start": "02:15", "end": "02:38", "lines": [{"level": 0, "text": "低點球屬於被動的「反戳」技術，會在後續課程另外教授，本集只教主動球"}]}, {"heading": "擊球高度示範對比", "start": "02:38", "end": "04:16", "lines": [{"level": 0, "text": "胸口到嘴巴高度：容易戳出旋轉球"}, {"level": 0, "text": "太遠的球：無法同時兼顧過網與旋轉，勉強做會變成「打」"}, {"level": 0, "text": "建議：讓球稍微掉低一點再處理，比高點勉強戳更容易成功"}]}, {"heading": "增加旋轉的蹬地技巧", "start": "04:16", "end": "05:00", "lines": [{"level": 0, "text": "展搓時右腿可以往外多蹬一點（不要停在原地）"}, {"level": 0, "text": "效果：球更容易轉，手部動作可以更少、更穩定"}]}, {"heading": "跑位與技術要求的關聯", "start": "05:00", "end": "05:32", "lines": [{"level": 0, "text": "靠外球仍可完成展搓，但需跑到位才能有效發力"}, {"level": 0, "text": "手指仍須放鬆，避免抓緊影響拍面角度與旋轉效果"}]}]}, {"category": "網前教學", "num": 23, "title": "23.正手搓球（展搓）最佳高度和擊球點", "tags": [{"tag": "斬戳最佳擊球高度", "reason": "00:00–00:49，核心主題：說明胸口到嘴巴之間是最佳高度，超過眼睛太高會很彆扭"}, {"tag": "斬戳需貼網才能做", "reason": "00:49–01:22，強調斬戳只能在球很貼網時使用，遠離網就做不到"}, {"tag": "離網距離與示範", "reason": "02:38–04:16，示範太遠、太高、太低時分別如何處理"}, {"tag": "右腿跨步輔助發力", "reason": "04:16–05:20，說明右腿往外延伸、往外蹬可讓球更轉"}, {"tag": "國際球員案例（李宗偉）", "reason": "00:56–02:04，引用李宗偉勾對角斬戳特別轉的例子"}, {"tag": "跑位到位的重要性", "reason": "05:00–05:20，強調若跑不到位很難完成任何技術"}, {"tag": "反戳預告", "reason": "02:14–02:34，提及低點時屬於反戳技術，將於後面課程教"}], "segments": [{"heading": "斬戳的最佳高度", "start": "00:00", "end": "00:49", "lines": [{"level": 0, "text": "最佳高度在胸口以上到嘴巴之間"}, {"level": 1, "text": "太高（到眼睛）會很彆扭，手腕角度要開很多才能朝下"}, {"level": 1, "text": "太低則球不會轉，只會往上走"}, {"level": 0, "text": "切戳與斬戳比較"}, {"level": 1, "text": "切戳可以應付較高位置，斬戳則不適合太高位置"}]}, {"heading": "斬戳只能貼網使用", "start": "00:49", "end": "02:04", "lines": [{"level": 0, "text": "斬戳的球不會飛得遠，因為動作幅度小，一舒展完就結束"}, {"level": 1, "text": "若要讓球飛遠，球就不會轉；若要球轉，就飛不遠"}, {"level": 0, "text": "貼網時擊球點放低也仍能製造旋轉，因為拍面接近水平"}, {"level": 0, "text": "舉例：李宗偉勾對角斬戳，球特別轉"}]}, {"heading": "低點屬於反戳技術", "start": "02:14", "end": "02:34", "lines": [{"level": 0, "text": "很低的位置也能斬戳，但那已經算是「反戳」"}, {"level": 0, "text": "反戳技術會在後面反手切戳課程中教，目前先學主動情況"}]}, {"heading": "示範：距離對斬戳的影響", "start": "02:34", "end": "03:31", "lines": [{"level": 0, "text": "太遠（未到白線）就做不了斬戳，必須貼近網才行"}, {"level": 0, "text": "只需靠近球輕輕斬戳，不用刻意打遠"}]}, {"heading": "示範：高度對斬戳的影響", "start": "03:31", "end": "04:16", "lines": [{"level": 0, "text": "太高的位置戳球會很僵硬、不容易"}, {"level": 0, "text": "建議讓球稍微掉低一點再戳，會更輕鬆好控制"}, {"level": 0, "text": "握拍不要太緊，稍微放鬆"}]}, {"heading": "右腿跨步與蹬地技巧", "start": "04:16", "end": "05:20", "lines": [{"level": 0, "text": "斬戳時右腿可以往外延伸多一點，跨過擊球點"}, {"level": 1, "text": "這樣手部動作可以更少，球更穩定"}, {"level": 0, "text": "練習時往外蹬多一點，可讓球更加旋轉"}, {"level": 0, "text": "靠外的球仍可完成，但需靠多轉一點手腕來補足"}, {"level": 0, "text": "強調跑位到位是完成任何技術的前提"}]}]}, {"category": "網前教學", "num": 24, "title": "24.正手搓球（展搓）隨著球飛的方向", "tags": [{"tag": "順球方向擊球最容易轉", "reason": "00:00–01:52，核心概念：順著球飛來的方向切球最容易產生旋轉"}, {"tag": "擊球位置偏側邊而非正中間", "reason": "00:28–01:16，說明打側邊比打正中間更容易轉"}, {"tag": "直線落球的因應方式", "reason": "01:52–02:41，球直直往下飛時的處理方法，需靠外並加快摩擦速度"}, {"tag": "最佳擊球點：右肩前方", "reason": "02:43–04:15，說明理想擊球點位置及跨步、腿部配合"}, {"tag": "手腕朝下角度的作用", "reason": "00:52–01:03，說明手腕朝下才能製造旋轉，平拍只會把球往上頂"}], "segments": [{"heading": "順著球飛方向擊球", "start": "00:00", "end": "00:52", "lines": [{"level": 0, "text": "球本身往外飛時，只需輕碰即可自然產生旋轉"}, {"level": 1, "text": "若逆著球的方向切，球會變得難控制、不轉"}, {"level": 0, "text": "對比：順向摩擦省力且容易轉，逆向操作需要精準時間點"}]}, {"heading": "擊球位置：偏側邊優於正中間", "start": "00:52", "end": "01:52", "lines": [{"level": 0, "text": "手腕應朝下一點角度切球，而非平拍"}, {"level": 1, "text": "平拍會讓球只往上走、不轉"}, {"level": 0, "text": "打正中間也可以轉，但非常依賴時間點精準，容易變成純粹的「打」而非「搓」"}]}, {"heading": "應對直線飛下的球", "start": "01:52", "end": "02:41", "lines": [{"level": 0, "text": "球直直飛下時仍可斬戳，但難度較高"}, {"level": 0, "text": "因應方法：從裡面往外朝外側移動摩擦，並加快摩擦速度"}, {"level": 0, "text": "靠外時擊球點放外側，並依靠腿部展開、手部加速摩擦"}]}, {"heading": "理想擊球點位置", "start": "02:41", "end": "04:27", "lines": [{"level": 0, "text": "最佳點在右肩前方，過中間位置也可用同樣手法"}, {"level": 0, "text": "若能往外跑再擊球，效果更好；太靠外則需更倚賴手指的補償動作"}, {"level": 0, "text": "只要順著球 d": "11:15", "lines": [{"level": 0, "text": "建議先掛一顆球練習手感、對球位置的空間感"}, {"level": 0, "text": "由同伴從外側拋球，接近球後手指放鬆完成收拍"}]}, {"heading": "靠外球的因應：跨大步、多轉手腕", "start": "11:15", "end": "12:25", "lines": [{"level": 0, "text": "球很靠外時右腿抬高、跨遠一點，左腿蹬地補足速度"}, {"level": 0, "text": "手部需要多轉一點角度來補償速度不足"}, {"level": 0, "text": "強調這只是「最佳做法」，即使動作不到位也能勉強戳出球"}]}]}, {"category": "網前教學", "num": 26, "title": "26.正手搓球(展搓）7訓練計劃", "tags": [{"tag": "分解式「一二戳」口令訓練法", "reason": "00:00–04:15，核心訓練方法：用「一、二、戳」口訣逐步練習收拍-舒展-轉拍節奏"}, {"tag": "手指放鬆貫穿全程", "reason": "多次強調，避免抓緊導致失誤或球飛高"}, {"tag": "加入步伐（跨腿蹬地）訓練", "reason": "01:17–04:15，從純手部動作進階到搭配腿部弓箭步"}, {"tag": "弓箭步蹬地細節說明", "reason": "02:13–02:52，左手後頂、身體後仰再蹬出去的力學原理"}, {"tag": "由大動作過渡到熟練後精簡動作", "reason": "04:03–04:28，說明練熟後可縮小動作、加快節奏"}, {"tag": "搭配拋球練習與同伴協助", "reason": "04:51–05:29，建議吊球或請同伴拋球練習空間感"}, {"tag": "右腿跨過擊球點更能增加旋轉效果", "reason": "05:45–08:26，國際球員技巧：右腿跨過球點反而讓球更「賺轉」"}, {"tag": "靠外球的應對：往外並步、蹬地補速度", "reason": "07:24–08:26，示範球靠外時如何跨步跟進"}], "segments": [{"heading": "基礎「一二戳」節奏訓練（不動步）", "start": "00:00", "end": "01:17", "lines": [{"level": 0, "text": "口令式練習：手回來（一）、舒展（二）、戳"}, {"level": 1, "text": "先慢後快，避免動作脫節"}, {"level": 1, "text": "動作不用做得誇張，逐漸縮小幅度"}, {"level": 0, "text": "手指全程放鬆，不可抓緊"}]}, {"heading": "加入胯部與抬腿動作", "start": "01:17", "end": "02:13", "lines": [{"level": 0, "text": "從純手部動作進階到胯部/抬腿配合"}, {"level": 0, "text": "抬腿落地瞬間完成戳球動作"}, {"level": 0, "text": "右腿可逐漸抬高，模擬蹬遠的動作"}]}, {"heading": "弓箭步蹬地原理說明", "start": "02:13", "end": "02:52", "lines": [{"level": 0, "text": "左手往後頂、身體略往後仰，才能蹬得遠"}, {"level": 1, "text": "若不往後頂，重心前傾會蹬不遠"}, {"level": 0, "text": "蹬地出去後，戳球瞬間身體再往下壓一下"}]}, {"heading": "帶入完整步伐（並步、啟動）練習", "start": "02:52", "end": "04:15", "lines": [{"level": 0, "text": "並步啟動後做「一二抬戳」完整動作"}, {"level": 0, "text": "熟練後可縮小動作、加快節奏，不需誇張大動作"}, {"level": 0, "text": "建議可用吊掛的球或同伴拋球練習空間感、找球感"}]}, {"heading": "同伴拋球實戰練習", "start": "04:51", "end": "05:45", "lines": [{"level": 0, "text": "請同伴從外側拋球，收拍靠近球再放鬆手指完成戳球"}, {"level": 0, "text": "初學可做大一點的動作，之後逐漸縮小"}, {"level": 0, "text": "右腿抬得 "level": 0, "text": "這樣動作最穩定，舒展後轉拍即可完成"}]}]}, {"category": "網前教學", "num": 28, "title": "28.反手（普通擋網技術)1握法", "tags": [{"tag": "反手四種握法詳解", "reason": "03:38–19:25，核心內容：詳細教授四種反手握法的手指位置與使用時機，佔全片最大篇幅"}, {"tag": "第一種握法（拇指頂寬面）的適用範圍與限制", "reason": "03:59–07:07，說明僅適用胸口以上、正前方，離開該範圍就用不了"}, {"tag": "第二種握法（拇指側邊頂框面／類李宗偉握法）", "reason": "09:40–14:56，說明其涵蓋範圍最廣、最常用"}, {"tag": "第三種握法（拇指頂斜稜）", "reason": "15:52–19:25，功能與第二種類似，適合勾球"}, {"tag": "第四種握法（拇指頂側稜）", "reason": "19:25–21:52，最被動情況下使用，強調三指扣緊的重要性"}, {"tag": "為何要學反手擋網技術（不能用正手握法代替）的原因說明", "reason": "00:00–03:38，開場動機說明"}, {"tag": "握法對拍面角度的影響（可否往上擋、往前推）", "reason": "06:23–08:39，多次示範不同握法在不同球高度下拍面朝向的差異"}, {"tag": "各握法與正常握法的轉換方式（微調拇指位置）", "reason": "14:56–19:25，說明如何從正常握法快速轉換至各握法"}, {"tag": "綜合角度示範四種握法的實際效果比較", "reason": "21:52–25:39，從第四角度示範四種握法在不同高度的可行性"}], "segments": [{"heading": "為何要學反手擋網技術（開場動機）", "start": "00:00", "end": "03:38", "lines": [{"level": 0, "text": "很多初學者用正手握法硬打反手球，是不對的做法"}, {"level": 1, "text": "常見於剛學習階段，但應避免"}, {"level": 0, "text": "學好反手擋網技術的三大理由："}, {"level": 1, "text": "被動情況下也能穩定控制球（放遠、放近皆可控制）"}, {"level": 1, "text": "突破「只會一種握法、只能打一兩個點」的限制"}, {"level": 1, "text": "方便銜接學習後續其他技術"}]}, {"heading": "四種握法總覽", "start": "03:38", "end": "04:00", "lines": [{"level": 0, "text": "嚴格來說反手共有四種握法，第三、四種差異只在拇指位置微調"}]}, {"heading": "第一種握法：拇指頂寬面", "start": "04:00", "end": "09:00", "lines": [{"level": 0, "text": "拇指頂在球拍寬面，四指自然握住，是最普遍、最經典的握法"}, {"level": 1, "text": "拇指位置需在特定肌肉/線上，不可放正中間或太靠近骨頭處"}, {"level": 0, "text": "適用範圍：僅限胸口以上、身體正前方"}, {"level": 1, "text": "稍微靠邊或放低，拍面角度就不對，很難往上擋或推球"}, {"level": 1, "text": "若遇到低球或靠邊球，用此握法會很難掰動手腕，球容易吃網"}]}, {"heading": "第二種握法：拇指側邊頂框面（類正手握法）", "start": "09:40", "end": "14:56", "lines": [{"level": 0, "text": "類似正手握法，只是稍微調整拇指位置"}, {"level": 0, "text": "適用範圍最廣：不論高、中、低位置皆可用，拍面能保持朝上或朝前"}, {"level": 1, "text": "從原本握法只需轉一點點即可切換"}, {"level": 0, "text": "空間感要保留一點，拇指跟食指維持接近同高度，不要完全貼死"}]}, {"heading": "第三種握法：拇指頂斜稜", "start": "15:52", "end": "19:25", "lines": [{"level": 0, "text": "功能與第二種握法相似，適合勾球或往前技術"}, {"level": 0, "text": "從正常握法把拇指抬上、頂在斜稜位置，可稍微靠外增加控制感"}, {"level": 0, "text": "後場反拍也會使用此握法（角度會調整更多，留待後面課程說明）"}]}, {"heading": "第四種握法：拇指頂側稜", "start": "19:25", "end": "21:52", "lines": [{"level": 0, "text": "用於非常被動、非常靠邊/遠的來球情況"}, {"level": 0, "text": "重點在於後三指要扣緊（前兩指只是輕握），才能撐住拍面角度"}, {"level": 0, "text": "同樣適用於後場反拍及被動勾球情況"}]}, {"heading": "四種握法之間的關係與學習建議", "start": "21:52", "end": "24:20", "lines": [{"level": 0, "text": "建議至少要學會三種：第一、第二，加上第三或第四擇一"}, {"level": 0, "text": "更建議四種全學，因為某些握法在特定情況完全用不了"}]}, {"heading": "從第四角度綜合示範比較", "start": "24:20", "end": "25:39", "lines": [{"level": 0, "text": "逐一示範四種握法在高、中、低、靠邊球時拍面朝向的差異"}, {"level": 0, "text": "第一種握法離開頭部/胸口以上範圍就無法過網"}, {"level": 0, "text": "第二、三種握法在各高度都能維持拍面朝上，適應力最強"}, {"level": 0, "text": "第四種握法轉手腕幅度最大，用於最被動的情況"}]}]}, {"category": "網前教學", "num": 29, "title": "29.反手（普通擋網技術）2示範", "tags": [{"tag": "第一種握法（拇指頂寬面）的實際限制示範", "reason": "00:00–03:38，核心示範：伸直手臂時拍面角度、及低球時完全無法掰動手腕吃網的問題"}, {"tag": "第二種握法（類正手／拇指側邊）全面性示範", "reason": "03:38–05:13，示範此握法在高、中、低、偏邊球都可正常運作，佔全片後半主要篇幅"}, {"tag": "收拍幅度與拍面角度的關係", "reason": "00:00–01:00，說明收一點點拍面就會斜、不需要用力推球"}, {"tag": "抬高手臂vs.伸直手臂的差異", "reason": "00:48–01:03，抬得越高、拍面越好控制"}, {"tag": "拇指方向錯誤示範（不可往下伸直）", "reason": "02:05–02:24，說明拇指若朝下伸直，拍面角度會不對、很難往上打"}, {"tag": "不同握法在不同高度的適用性總結比較", "reason": "03:11–03:38，總結何時該用哪種握法"}], "segments": [{"heading": "第一種握法的角度限制示範", "start": "00:00", "end": "01:03", "lines": [{"level": 0, "text": "手臂完全伸直時，拍面容易朝下、球會直接吃網"}, {"level": 1, "text": "掰手腕嘗試修正會感覺整個肩膀都僵住"}, {"level": 0, "text": "解法：收一點手臂（不需收很多），拍面立刻自然變斜，不需用力推球"}, {"level": 0, "text": "抬得越高，這種握法反而越好控制"}]}, {"heading": "驗證此握法僅適用頭部/胸口以上區域", "start": "01:03", "end": "02:05", "lines": [{"level": 0, "text": "頭上位置做推球、撲球、擋網都很順暢，不用多想"}, {"level": 0, "text": "但稍微降低或靠邊，拍面角度就跑掉，變得很難用"}]}, {"heading": "低球時的失敗示範與原因說明", "start": "02:05", "end": "02:24", "lines": [{"level": 0, "text": "刻意示範放低後嘗試掰手腕，效果非常勉強、彆扭"}, {"level": 0, "text": "拇指必須永遠往後頂住，不可以往下伸直"}, {"level": 1, "text": "若拇指往下伸直，拍面角度不對，很難網前吃球，也難以往上打"}]}, {"heading": "引出第二種握法的優勢", "start": "02:24", function findRecord(category, num) {
  return DATA.find(d => d.category === category && d.num === num);
}

function renderLines(lines) {
  let html = "";
  let openLevels = 0;
  lines.forEach((ln, i) => {
    const prevLevel = i === 0 ? 0 : lines[i - 1].level;
    if (ln.level > prevLevel) {
      html += "<ul>".repeat(ln.level - prevLevel);
      openLevels += (ln.level - prevLevel);
    } else if (ln.level < prevLevel) {
      html += "</li></ul>".repeat(prevLevel - ln.level);
      openLevels -= (prevLevel - ln.level);
      html += "</li>";
    } else if (i > 0) {
      html += "</li>";
    }
    html += `<li>${ln.text}`;
  });
  html += "</li>" + "</ul>".repeat(openLevels);
  return `<ul>${html}</ul>`;
}

function renderEpisodeDetail(rec) {
  if (!rec) return "<p style='color:#999;font-size:0.82rem'>（找不到對應集數資料）</p>";
  const tagListHtml = rec.tags.map(t =>
    `<li><b>${t.tag}</b> <span class="reason">（${t.reason}）</span></li>`
  ).join("");
  const segmentsHtml = rec.segments.map(seg => `
    <div class="segment">
      <span class="segment-head">${seg.heading}</span>
      <span class="segment-time">（${seg.start}–${seg.end}）</span>
      ${renderLines(seg.lines)}
    </div>
  `).join("");
  return `<ol class="tag-list">${tagListHtml}</ol>${segmentsHtml}`;
}

// ---------- 課程地圖 ----------
function renderCurriculum() {
  const box = document.getElementById("view-curriculum");
  box.innerHTML = CURRICULUM.map((stage, si) => `
    <div class="stage">
      <div class="stage-marker">${si + 1}</div>
      <div class="stage-title">${stage.stage}</div>
      <div class="stage-desc">${stage.desc}</div>
      ${stage.skills.map((skill, ki) => `
        <div class="skill-card" data-stage="${si}" data-skill="${ki}">
          <div class="skill-head">
            <div class="skill-name">${skill.name}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="skill-count">${skill.refs.length} 集</span>
              <span class="skill-arrow">▶</span>
            </div>
          </div>
          <div class="skill-body">
            ${skill.refs.map(([cat, num]) => {
              const rec = findRecord(cat, num);
              const title = rec ? rec.title : `${num}.（找不到）`;
              return `
                <div class="ep-chip" data-cat="${cat}" data-num="${num}">
                  <div class="ep-chip-title">${title}</div>
                  <div class="ep-detail"></div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `).join("")}
    </div>
  `).join("");

  box.querySelectorAll(".skill-head").forEach(head => {
    head.addEventListener("click", () => head.closest(".skill-card").classList.toggle("open"));
  });
  box.querySelectorAll(".ep-chip").forEach(chip => {
    chip.addEventListener("click", (e) => {
      chip.classList.toggle("open");
      const detail = chip.querySelector(".ep-detail");
      if (chip.classList.contains("open") && !detail.dataset.loaded) {
        const rec = findRecord(chip.dataset.cat, parseInt(chip.dataset.num));
        detail.innerHTML = renderEpisodeDetail(rec);
        detail.dataset.loaded = "1";
      }
    });
  });
}

// ---------- 常見問題查詢 ----------
function renderSymptoms(query) {
  const box = document.getElementById("symptomsList");
  const q = (query || "").trim().toLowerCase();

  let anyMatch = false;
  box.innerHTML = SYMPTOMS.map(group => {
    const items = group.items.filter(it => !q || it.symptom.toLowerCase().includes(q));
    if (items.length === 0) return "";
    anyMatch = true;
    return `
      <div class="sym-group-title">${group.group}</div>
      ${items.map(it => `
        <div class="sym-card">
          <div class="sym-head">
            <span class="sym-icon">⚠</span>
            <span class="sym-name">${it.symptom}</span>
            <span class="sym-arrow">▶</span>
          </div>
          <div class="sym-body">
            ${it.refs.map(([cat, num, time]) => {
              const rec = findRecord(cat, num);
              const title = rec ? rec.title : `${num}.（找不到）`;
              return `
                <div class="sym-ref" data-cat="${cat}" data-num="${num}">
                  <div class="sym-ref-title">${title}</div>
                  <div class="sym-ref-time">${time}</div>
                  <div class="sym-ref-detail"></div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `).join("")}
    `;
  }).join("");

  document.getElementById("empty").style.display = (q && !anyMatch) ? "block" : "none";

  box.querySelectorAll(".sym-head").forEach(head => {
    head.addEventListener("click", () => head.closest(".sym-card").classList.toggle("open"));
  });
  box.querySelectorAll(".sym-ref").forEach(ref => {
    ref.addEventListener("click", (e) => {
      ref.classList.toggle("open");
      const detail = ref.querySelector(".sym-ref-detail");
      if (ref.classList.contains("open") && !detail.dataset.loaded) {
        const rec = findRecord(ref.dataset.cat, parseInt(ref.dataset.num));
        detail.innerHTML = renderEpisodeDetail(rec);
        detail.dataset.loaded = "1";
      }
    });
  });
}
