  :root {
    --ink: #1c2733;
    --ink-soft: #44515f;
    --paper: #f4f1ea;
    --card: #ffffff;
    --rule: #d9d3c7;
    --accent: #2f5d7c;
    --accent-soft: #e7eef3;
    --serif: "Noto Serif TC", "Songti TC", Georgia, serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--rule);
    padding: 40px 24px 32px;
    text-align: center;
  }
  header h1 {
    font-family: var(--serif);
    font-size: 2rem;
    color: var(--accent);
    margin-bottom: 8px;
  }
  header p {
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .container {
    max-width: 860px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .section-title {
    font-family: var(--serif);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .article-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .article-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 20px 24px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s;
  }
  .article-card:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(47,93,124,0.1);
  }
  .article-card .title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .article-card:hover .title {
    color: var(--accent);
  }
  .article-card .meta {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .article-card .arrow {
    font-size: 1.2rem;
    color: var(--rule);
    flex-shrink: 0;
    margin-left: 16px;
    transition: all 0.15s;
  }
  .article-card:hover .arrow {
    color: var(--accent);
    transform: translateX(4px);
  }
  .count {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .file-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .file-card .title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .file-card .meta {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .file-actions {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn {
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-view {
    background: var(--accent);
    color: #fff;
  }
  .btn-view:hover {
    background: #244a63;
  }
  .btn-download {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-download:hover {
    background: #d8e5ee;
  }
  footer {
    text-align: center;
    padding: 40px 24px;
    color: var(--ink-soft);
    font-size: 0.82rem;
    border-top: 1px solid var(--rule);
    margin-top: 60px;
  }
</style>
</head>
